<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Logistic Regression compared with Softmax Regression</title>
  <desc id="description">A shared set of input features flows into two side-by-side pipelines. Logistic Regression uses one score and the Sigmoid function for two classes, while Softmax Regression uses one score per class and the Softmax function for three or more classes.</desc>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="binaryGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="multiclassGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#ffedd5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/>
    </marker>
    <style>
      .font { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .heading { font-size: 30px; font-weight: 700; }
      .column-title { font-size: 25px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 600; }
      .body { font-size: 17px; }
      .small { font-size: 15px; }
      .muted { fill: #475569; }
      .white { fill: #ffffff; }
      .blue { fill: #1d4ed8; }
      .orange { fill: #c2410c; }
    </style>
  </defs>

  <rect width="1200" height="720" rx="24" fill="#f8fafc"/>
  <rect width="1200" height="92" rx="24" fill="url(#headerGradient)"/>
  <rect y="68" width="1200" height="24" fill="url(#headerGradient)"/>
  <text x="600" y="46" text-anchor="middle" class="font heading white">Logistic Regression vs. Softmax Regression</text>
  <text x="600" y="73" text-anchor="middle" class="font body" fill="#c7d2fe">Two classification paths from the same input features</text>

  <!-- Shared input -->
  <g filter="url(#shadow)">
    <rect x="430" y="118" width="340" height="74" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  </g>
  <circle cx="474" cy="155" r="20" fill="#e2e8f0"/>
  <path d="M465 161 L472 151 L479 157 L486 146" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="615" y="148" text-anchor="middle" class="font label" fill="#0f172a">Input features (X)</text>
  <text x="615" y="173" text-anchor="middle" class="font small muted">The same feature vector can feed either model</text>

  <!-- Split connectors -->
  <path d="M520 192 C520 220 315 216 315 246" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M680 192 C680 220 885 216 885 246" fill="none" stroke="#ea580c" stroke-width="3" marker-end="url(#arrowOrange)"/>

  <!-- Column backgrounds -->
  <rect x="52" y="248" width="526" height="420" rx="24" fill="url(#binaryGradient)" stroke="#93c5fd" stroke-width="2"/>
  <rect x="622" y="248" width="526" height="420" rx="24" fill="url(#multiclassGradient)" stroke="#fdba74" stroke-width="2"/>

  <!-- Binary column -->
  <circle cx="96" cy="292" r="22" fill="#2563eb"/>
  <text x="96" y="299" text-anchor="middle" class="font label white">2</text>
  <text x="130" y="290" class="font column-title blue">Logistic Regression</text>
  <rect x="130" y="300" width="204" height="28" rx="14" fill="#dbeafe"/>
  <text x="232" y="320" text-anchor="middle" class="font small blue" font-weight="700">BINARY CLASSIFICATION</text>

  <rect x="92" y="350" width="446" height="66" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="315" y="378" text-anchor="middle" class="font label" fill="#0f172a">Linear score</text>
  <text x="315" y="401" text-anchor="middle" class="font body muted">z = w^T x + b</text>

  <path d="M315 416 L315 449" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <rect x="92" y="452" width="446" height="66" rx="14" fill="#2563eb"/>
  <text x="315" y="480" text-anchor="middle" class="font label white">Sigmoid function</text>
  <text x="315" y="503" text-anchor="middle" class="font body" fill="#dbeafe">Converts one score into P(y = 1)</text>

  <path d="M315 518 L315 551" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <rect x="92" y="554" width="446" height="82" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="122" y="580" class="font label" fill="#0f172a">Output: 2 classes</text>
  <rect x="122" y="596" width="330" height="14" rx="7" fill="#dbeafe"/>
  <rect x="122" y="596" width="281" height="14" rx="7" fill="#2563eb"/>
  <text x="466" y="610" class="font small blue">Spam 85%</text>
  <text x="122" y="630" class="font small muted">Not Spam = 1 - P(Spam) = 15%</text>

  <!-- Multiclass column -->
  <circle cx="666" cy="292" r="22" fill="#ea580c"/>
  <text x="666" y="299" text-anchor="middle" class="font label white">3+</text>
  <text x="704" y="290" class="font column-title orange">Softmax Regression</text>
  <rect x="704" y="300" width="238" height="28" rx="14" fill="#ffedd5"/>
  <text x="823" y="320" text-anchor="middle" class="font small orange" font-weight="700">MULTICLASS CLASSIFICATION</text>

  <rect x="662" y="350" width="446" height="66" rx="14" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
  <text x="885" y="378" text-anchor="middle" class="font label" fill="#0f172a">One linear score per class</text>
  <text x="885" y="401" text-anchor="middle" class="font body muted">z_1, z_2, ..., z_K</text>

  <path d="M885 416 L885 449" fill="none" stroke="#ea580c" stroke-width="3" marker-end="url(#arrowOrange)"/>

  <rect x="662" y="452" width="446" height="66" rx="14" fill="#ea580c"/>
  <text x="885" y="480" text-anchor="middle" class="font label white">Softmax function</text>
  <text x="885" y="503" text-anchor="middle" class="font body" fill="#ffedd5">Normalizes all K scores together</text>

  <path d="M885 518 L885 551" fill="none" stroke="#ea580c" stroke-width="3" marker-end="url(#arrowOrange)"/>

  <rect x="662" y="554" width="446" height="82" rx="14" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
  <text x="692" y="580" class="font label" fill="#0f172a">Output: probability for every class</text>
  <rect x="692" y="596" width="270" height="11" rx="5.5" fill="#ffedd5"/>
  <rect x="692" y="596" width="189" height="11" rx="5.5" fill="#ea580c"/>
  <text x="975" y="607" class="font small orange">Cat 70%</text>
  <text x="692" y="627" class="font small muted">Dog 20%  |  Horse 10%  |  Total 100%</text>

  <text x="600" y="700" text-anchor="middle" class="font small muted">Key difference: Sigmoid models one positive-class probability; Softmax models a distribution across all classes.</text>
</svg>
