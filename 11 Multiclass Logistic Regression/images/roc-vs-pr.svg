<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="title description">
  <title id="title">ROC curve versus Precision-Recall curve on an imbalanced dataset</title>
  <desc id="description">On a highly imbalanced dataset the ROC curve can look excellent while the Precision-Recall curve reveals the model performs poorly on the rare positive class. The ROC baseline is the diagonal, while the PR baseline is the positive-class prevalence.</desc>

  <rect width="1120" height="440" rx="16" fill="#ffffff"/>
  <text x="40" y="40" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Same Imbalanced Model: ROC Looks Good, PR Tells the Truth</text>

  <!-- Panel 1: ROC -->
  <rect x="20" y="64" width="520" height="356" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="280" y="94" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1e3a8a">ROC Curve — AUC = 0.93</text>
  <line x1="80" y1="360" x2="320" y2="360" stroke="#334155" stroke-width="2"/>
  <line x1="80" y1="360" x2="80" y2="80" stroke="#334155" stroke-width="2"/>
  <text x="200" y="392" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#334155">FPR</text>
  <text x="56" y="220" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#334155" transform="rotate(-90 56 220)">TPR</text>
  <line x1="80" y1="360" x2="320" y2="80" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M80,360 L92,192 L116,130 L176,100 L320,80 L320,360 Z" fill="#2563eb" fill-opacity="0.12"/>
  <path d="M80,360 L92,192 L116,130 L176,100 L320,80" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="340" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2563eb">looks</text>
  <text x="340" y="168" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2563eb">excellent</text>

  <!-- Panel 2: PR -->
  <rect x="560" y="64" width="540" height="356" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="840" y="94" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#7c2d12">PR Curve — AP = 0.46</text>
  <line x1="620" y1="360" x2="860" y2="360" stroke="#334155" stroke-width="2"/>
  <line x1="620" y1="360" x2="620" y2="80" stroke="#334155" stroke-width="2"/>
  <text x="740" y="392" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#334155">Recall</text>
  <text x="596" y="220" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#334155" transform="rotate(-90 596 220)">Precision</text>
  <!-- prevalence baseline (0.1) -->
  <line x1="620" y1="332" x2="860" y2="332" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="664" y="326" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#94a3b8">baseline = prevalence (0.10)</text>
  <path d="M632,94 L668,122 L716,178 L764,234 L812,276 L860,310" fill="none" stroke="#ea580c" stroke-width="3"/>
  <text x="712" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ea580c">precision collapses</text>
  <text x="712" y="168" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ea580c">as recall rises</text>

  <text x="40" y="430" font-family="Arial, Helvetica, sans-serif" font-size="12" font-style="italic" fill="#64748b">When the positive class is rare, abundant true negatives inflate ROC-AUC. PR-AUC ignores TN and exposes weak minority-class performance.</text>
</svg>
