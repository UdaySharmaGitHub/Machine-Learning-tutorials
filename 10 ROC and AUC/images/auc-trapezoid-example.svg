<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" role="img" aria-labelledby="title description">
  <title id="title">ROC example with trapezoidal AUC</title>
  <desc id="description">ROC points (0, 0), (0.2, 0.6), (0.5, 0.8), and (1, 1) are connected. The three shaded trapezoids have areas 0.06, 0.21, and 0.45, totaling an AUC of 0.72.</desc>
  <rect width="800" height="540" fill="#ffffff"/>
  <text x="400" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#243247">Trapezoidal AUC = 0.06 + 0.21 + 0.45 = 0.72</text>

  <g stroke="#dce3eb" stroke-width="1">
    <path d="M100 70V430 M220 70V430 M340 70V430 M460 70V430 M580 70V430 M700 70V430"/>
    <path d="M100 430H700 M100 358H700 M100 286H700 M100 214H700 M100 142H700 M100 70H700"/>
  </g>

  <g>
    <polygon points="100,430 220,214 220,430" fill="#60a5fa" fill-opacity="0.35"/>
    <polygon points="220,214 400,142 400,430 220,430" fill="#a78bfa" fill-opacity="0.32"/>
    <polygon points="400,142 700,70 700,430 400,430" fill="#fbbf24" fill-opacity="0.32"/>
  </g>

  <path d="M100 430L700 70" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="505" y="285" transform="rotate(-31 505 285)" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">Random baseline</text>

  <path d="M100 430L220 214L400 142L700 70" fill="none" stroke="#1769aa" stroke-width="4" stroke-linejoin="round"/>

  <g fill="#1769aa" stroke="#ffffff" stroke-width="2">
    <circle cx="100" cy="430" r="6"/>
    <circle cx="220" cy="214" r="6"/>
    <circle cx="400" cy="142" r="6"/>
    <circle cx="700" cy="70" r="6"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#243247">
    <text x="132" y="325">A₁ = 0.06</text>
    <text x="274" y="321">A₂ = 0.21</text>
    <text x="509" y="314">A₃ = 0.45</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" fill="#374151">
    <text x="112" y="420">(0.0, 0.0)</text>
    <text x="231" y="207">(0.2, 0.6)</text>
    <text x="410" y="136">(0.5, 0.8)</text>
    <text x="627" y="61">(1.0, 1.0)</text>
  </g>

  <g fill="none" stroke="#374151" stroke-width="2">
    <path d="M100 70V430H700"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#374151" text-anchor="middle">
    <text x="100" y="452">0.0</text>
    <text x="220" y="452">0.2</text>
    <text x="340" y="452">0.4</text>
    <text x="460" y="452">0.6</text>
    <text x="580" y="452">0.8</text>
    <text x="700" y="452">1.0</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#374151" text-anchor="end">
    <text x="88" y="435">0.0</text>
    <text x="88" y="363">0.2</text>
    <text x="88" y="291">0.4</text>
    <text x="88" y="219">0.6</text>
    <text x="88" y="147">0.8</text>
    <text x="88" y="75">1.0</text>
  </g>
  <text x="400" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#243247">False Positive Rate (FPR)</text>
  <text x="28" y="250" transform="rotate(-90 28 250)" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#243247">True Positive Rate (TPR)</text>
</svg>
