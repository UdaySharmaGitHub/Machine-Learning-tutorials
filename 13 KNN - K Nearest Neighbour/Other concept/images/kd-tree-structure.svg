<svg width="900" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="450" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1976d2">KD-Tree Structure (2D Example)</text>

  <!-- Tree nodes -->
  <!-- Root -->
  <circle cx="450" cy="80" r="35" fill="#d32f2f" stroke="#000" stroke-width="2"/>
  <text x="450" y="85" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">Root</text>
  <text x="450" y="102" font-size="11" text-anchor="middle" fill="#fff">x=5</text>

  <!-- Level 1 children -->
  <!-- Left child -->
  <circle cx="200" cy="180" r="35" fill="#1976d2" stroke="#000" stroke-width="2"/>
  <text x="200" y="185" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">Left</text>
  <text x="200" y="202" font-size="11" text-anchor="middle" fill="#fff">y=3</text>

  <!-- Right child -->
  <circle cx="700" cy="180" r="35" fill="#388e3c" stroke="#000" stroke-width="2"/>
  <text x="700" y="185" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">Right</text>
  <text x="700" y="202" font-size="11" text-anchor="middle" fill="#fff">y=7</text>

  <!-- Level 2 children -->
  <!-- Left-Left -->
  <circle cx="80" cy="280" r="30" fill="#4ecdc4" stroke="#000" stroke-width="2"/>
  <text x="80" y="283" font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">LL</text>
  <text x="80" y="299" font-size="10" text-anchor="middle" fill="#fff">x=1</text>

  <!-- Left-Right -->
  <circle cx="320" cy="280" r="30" fill="#4ecdc4" stroke="#000" stroke-width="2"/>
  <text x="320" y="283" font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">LR</text>
  <text x="320" y="299" font-size="10" text-anchor="middle" fill="#fff">x=2</text>

  <!-- Right-Left -->
  <circle cx="580" cy="280" r="30" fill="#95e1d3" stroke="#000" stroke-width="2"/>
  <text x="580" y="283" font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">RL</text>
  <text x="580" y="299" font-size="10" text-anchor="middle" fill="#fff">x=9</text>

  <!-- Right-Right -->
  <circle cx="820" cy="280" r="30" fill="#95e1d3" stroke="#000" stroke-width="2"/>
  <text x="820" y="283" font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">RR</text>
  <text x="820" y="299" font-size="10" text-anchor="middle" fill="#fff">x=7</text>

  <!-- Leaf nodes -->
  <rect x="20" y="360" width="70" height="50" fill="#ffcdd2" stroke="#000" stroke-width="1" rx="3"/>
  <text x="55" y="378" font-size="10" text-anchor="middle" fill="#000">P1(1,1)</text>
  <text x="55" y="393" font-size="10" text-anchor="middle" fill="#000">P2(2,2)</text>

  <rect x="140" y="360" width="70" height="50" fill="#ffcdd2" stroke="#000" stroke-width="1" rx="3"/>
  <text x="175" y="378" font-size="10" text-anchor="middle" fill="#000">P3(1,5)</text>

  <rect x="520" y="360" width="70" height="50" fill="#c8e6c9" stroke="#000" stroke-width="1" rx="3"/>
  <text x="555" y="378" font-size="10" text-anchor="middle" fill="#000">P4(7,8)</text>
  <text x="555" y="393" font-size="10" text-anchor="middle" fill="#000">P5(9,6)</text>

  <rect x="760" y="360" width="70" height="50" fill="#c8e6c9" stroke="#000" stroke-width="1" rx="3"/>
  <text x="795" y="378" font-size="10" text-anchor="middle" fill="#000">P6(8,2)</text>

  <!-- Edges -->
  <!-- Root to Level 1 -->
  <line x1="425" y1="110" x2="225" y2="150" stroke="#000" stroke-width="2"/>
  <line x1="475" y1="110" x2="675" y2="150" stroke="#000" stroke-width="2"/>

  <!-- Level 1 to Level 2 -->
  <line x1="175" y1="210" x2="105" y2="250" stroke="#000" stroke-width="1.5"/>
  <line x1="225" y1="210" x2="295" y2="250" stroke="#000" stroke-width="1.5"/>
  <line x1="675" y1="210" x2="605" y2="250" stroke="#000" stroke-width="1.5"/>
  <line x1="725" y1="210" x2="795" y2="250" stroke="#000" stroke-width="1.5"/>

  <!-- Level 2 to Leaves -->
  <line x1="80" y1="310" x2="55" y2="360" stroke="#000" stroke-width="1"/>
  <line x1="320" y1="310" x2="175" y2="360" stroke="#000" stroke-width="1"/>
  <line x1="580" y1="310" x2="555" y2="360" stroke="#000" stroke-width="1"/>
  <line x1="820" y1="310" x2="795" y2="360" stroke="#000" stroke-width="1"/>

  <!-- Legend -->
  <rect x="50" y="430" width="800" height="60" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="5"/>
  <text x="60" y="450" font-size="12" font-weight="bold" fill="#000">Legend:</text>
  <circle cx="70" cy="468" r="8" fill="#d32f2f"/>
  <text x="85" y="473" font-size="11" fill="#000">Root (Split on X)</text>

  <circle cx="280" cy="468" r="8" fill="#1976d2"/>
  <text x="295" y="473" font-size="11" fill="#000">Level 1 (Split on Y)</text>

  <circle cx="520" cy="468" r="8" fill="#4ecdc4"/>
  <text x="535" y="473" font-size="11" fill="#000">Level 2 (Split on X)</text>

  <rect x="730" y="460" width="15" height="15" fill="#ffcdd2" stroke="#000" stroke-width="1"/>
  <text x="755" y="473" font-size="11" fill="#000">Leaf Nodes (Points)</text>
</svg>