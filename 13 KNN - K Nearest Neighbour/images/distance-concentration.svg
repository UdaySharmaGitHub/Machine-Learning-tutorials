<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Distance Concentration in High Dimensions</title>
  <desc id="desc">Visual comparison showing how distances spread out in low dimensions but concentrate into a narrow shell in high dimensions, making nearest neighbors indistinguishable.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
      .title { font: 700 22px system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 13px system-ui, -apple-system, sans-serif; fill: #64748b; }
      .card-title { font: 700 16px system-ui, -apple-system, sans-serif; }
      .card-sub { font: 500 12px system-ui, -apple-system, sans-serif; fill: #64748b; }
      .label { font: 600 12px system-ui, -apple-system, sans-serif; fill: #334155; }
      .small { font: 500 11px system-ui, -apple-system, sans-serif; fill: #64748b; }
      .badge-txt { font: 700 11px system-ui, -apple-system, sans-serif; }
      .formula { font: 600 12px "SF Mono", Menlo, Consolas, monospace; }
      .query-dot { fill: #0f172a; stroke: #ffffff; stroke-width: 2.5; }
      .pt-near { fill: #10b981; stroke: #047857; stroke-width: 1.5; }
      .pt-far { fill: #ef4444; stroke: #b91c1c; stroke-width: 1.5; }
      .pt-mid { fill: #3b82f6; stroke: #1d4ed8; stroke-width: 1.5; }
      .dist-line { stroke-width: 1.5; stroke-dasharray: 4 3; }
    </style>
    <marker id="arrow-near" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 1L8 5L0 9z" fill="#10b981"/>
    </marker>
    <marker id="arrow-far" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 1L8 5L0 9z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect class="bg" width="960" height="560" rx="16"/>

  <!-- Main Title -->
  <text class="title" x="36" y="42">The Distance Concentration Phenomenon</text>
  <text class="subtitle" x="36" y="62">Why the distinction between the "nearest" and "farthest" neighbor vanishes as dimensions increase</text>

  <!-- ==================== LEFT CARD: LOW DIMENSIONS ==================== -->
  <g transform="translate(36, 82)">
    <rect class="card" width="432" height="400" rx="14"/>

    <!-- Header Box -->
    <rect x="0" y="0" width="432" height="56" rx="14" fill="#f0fdf4"/>
    <rect x="0" y="44" width="432" height="12" fill="#f0fdf4"/>
    <text class="card-title" x="20" y="28" fill="#166534">Low Dimensions (d = 2 or 3)</text>
    <text class="card-sub" x="20" y="46" fill="#15803d">High contrast: Nearest neighbors are meaningfully closer than distant points</text>

    <!-- Neighborhood Scatter Space -->
    <!-- Circles indicating distance rings -->
    <circle cx="200" cy="180" r="45" fill="none" stroke="#bbf7d0" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="200" cy="180" r="95" fill="none" stroke="#fed7aa" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="200" cy="180" r="140" fill="none" stroke="#fecaca" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- Distance Vectors -->
    <line x1="200" y1="180" x2="168" y2="150" stroke="#10b981" class="dist-line" marker-end="url(#arrow-near)"/>
    <line x1="200" y1="180" x2="310" y2="245" stroke="#ef4444" class="dist-line" marker-end="url(#arrow-far)"/>

    <!-- Points -->
    <circle class="pt-near" cx="165" cy="148" r="8"/>
    <text class="small" x="125" y="142" font-weight="700" fill="#047857">d_min = 0.8</text>

    <circle class="pt-mid" cx="240" cy="145" r="7"/>
    <circle class="pt-mid" cx="150" cy="220" r="7"/>
    <circle class="pt-mid" cx="260" cy="210" r="7"/>

    <circle class="pt-far" cx="314" cy="248" r="8"/>
    <text class="small" x="326" y="254" font-weight="700" fill="#b91c1c">d_max = 4.2</text>

    <!-- Query Point -->
    <circle class="query-dot" cx="200" cy="180" r="9"/>
    <text class="label" x="200" y="206" text-anchor="middle" font-weight="700">Query x_q</text>

    <!-- Stats Box -->
    <rect x="20" y="296" width="392" height="88" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text class="label" x="32" y="318">Distance Spread &amp; Contrast Ratio:</text>
    
    <text class="formula" x="32" y="340" fill="#0f172a">d_max / d_min = 4.2 / 0.8 ≈ 5.25  (High contrast!)</text>
    <rect x="32" y="352" width="368" height="24" rx="6" fill="#dcfce7" stroke="#86efac"/>
    <text class="badge-txt" x="42" y="368" fill="#166534">✅ KNN Valid: True local neighbors exist and dominate predictions</text>
  </g>

  <!-- ==================== RIGHT CARD: HIGH DIMENSIONS ==================== -->
  <g transform="translate(492, 82)">
    <rect class="card" width="432" height="400" rx="14"/>

    <!-- Header Box -->
    <rect x="0" y="0" width="432" height="56" rx="14" fill="#fef2f2"/>
    <rect x="0" y="44" width="432" height="12" fill="#fef2f2"/>
    <text class="card-title" x="20" y="28" fill="#991b1b">High Dimensions (d = 100+)</text>
    <text class="card-sub" x="20" y="46" fill="#b91c1c">Zero contrast: All points concentrate in a narrow equidistant shell</text>

    <!-- Neighborhood Concentrated Shell -->
    <circle cx="216" cy="180" r="115" fill="none" stroke="#fca5a5" stroke-width="18" opacity="0.35"/>
    <circle cx="216" cy="180" r="124" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="216" cy="180" r="106" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Distance Vectors showing almost identical lengths -->
    <line x1="216" y1="180" x2="115" y2="140" stroke="#10b981" class="dist-line" marker-end="url(#arrow-near)"/>
    <line x1="216" y1="180" x2="330" y2="200" stroke="#ef4444" class="dist-line" marker-end="url(#arrow-far)"/>

    <!-- Points along the shell -->
    <circle class="pt-near" cx="112" cy="138" r="7"/>
    <text class="small" x="50" y="132" font-weight="700" fill="#047857">d_min = 9.8</text>

    <circle class="pt-mid" cx="150" cy="275" r="7"/>
    <circle class="pt-mid" cx="280" cy="88" r="7"/>
    <circle class="pt-mid" cx="170" cy="75" r="7"/>
    <circle class="pt-mid" cx="295" cy="255" r="7"/>

    <circle class="pt-far" cx="334" cy="202" r="7"/>
    <text class="small" x="345" y="206" font-weight="700" fill="#b91c1c">d_max = 10.3</text>

    <!-- Query Point -->
    <circle class="query-dot" cx="216" cy="180" r="9"/>
    <text class="label" x="216" y="206" text-anchor="middle" font-weight="700">Query x_q</text>

    <!-- Stats Box -->
    <rect x="20" y="296" width="392" height="88" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text class="label" x="32" y="318">Distance Spread &amp; Contrast Ratio:</text>
    
    <text class="formula" x="32" y="340" fill="#991b1b">d_max / d_min = 10.3 / 9.8 ≈ 1.05  (Contrast vanishes!)</text>
    <rect x="32" y="352" width="368" height="24" rx="6" fill="#fee2e2" stroke="#fca5a5"/>
    <text class="badge-txt" x="42" y="368" fill="#991b1b">⚠️ KNN Fails: All points appear equidistant; neighbor ranking is noise</text>
  </g>

  <!-- Bottom Key Formula Bar -->
  <g transform="translate(36, 496)">
    <rect width="888" height="46" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text class="small" x="20" y="28" fill="#334155">
      <tspan font-weight="700" fill="#0f172a">Mathematical Theorem (Beyer et al.):</tspan>
      As dimension d → ∞,  <tspan font-family="monospace" font-weight="700" fill="#7c3aed">lim (d_max - d_min) / d_min = 0</tspan>. The relative standard deviation shrinks like <tspan font-family="monospace">1/√d</tspan>, collapsing metric distinction.
    </text>
  </g>
</svg>