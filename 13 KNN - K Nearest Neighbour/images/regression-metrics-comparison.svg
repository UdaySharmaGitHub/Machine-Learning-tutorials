<svg xmlns="http://www.w3.org/2000/svg" width="740" height="410" viewBox="0 0 740 410" role="img" aria-labelledby="rm-title rm-desc">
  <title id="rm-title">MAE vs RMSE: Outlier Sensitivity Comparison</title>
  <desc id="rm-desc">Two side-by-side bar charts. Left panel shows five equal errors of magnitude 1 where MAE equals RMSE equals 1.0. Right panel shows four zero errors plus one large error of 5, where MAE is still 1.0 but RMSE jumps to 2.24, illustrating that RMSE penalises large errors more heavily.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}
      .panel{fill:#fff;stroke:#e2e8f0;stroke-width:1.5}
      .title{font:700 21px system-ui,sans-serif;fill:#111827}
      .ptitle{font:700 15px system-ui,sans-serif;fill:#111827}
      .axlbl{font:11px system-ui,sans-serif;fill:#6b7280}
      .bar-eq{fill:#2563eb;fill-opacity:.8}
      .bar-out{fill:#ea580c;fill-opacity:.85}
      .bar-sm{fill:#94a3b8;fill-opacity:.6}
      .metric{font:700 14px system-ui,sans-serif}
      .mval{font:700 20px system-ui,sans-serif}
      .note{font:12px system-ui,sans-serif;fill:#6b7280}
      .concl{font:700 13px system-ui,sans-serif}
    </style>
  </defs>

  <!-- background -->
  <rect class="bg" width="740" height="410" rx="14"/>

  <!-- title -->
  <text class="title" x="370" y="36" text-anchor="middle">MAE vs RMSE — Outlier Sensitivity</text>

  <!-- ══ LEFT PANEL: 5 equal errors ════════════════════════════════════════ -->
  <rect class="panel" x="20" y="52" width="335" height="250" rx="8"/>
  <text class="ptitle" x="187" y="74" text-anchor="middle">Scenario A — Uniform Errors</text>
  <text class="note" x="187" y="90" text-anchor="middle">errors = [1, 1, 1, 1, 1]</text>

  <!-- y-axis -->
  <line x1="68" y1="100" x2="68" y2="255" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- y-axis ticks + labels -->
  <line x1="63" y1="255" x2="68" y2="255" stroke="#94a3b8" stroke-width="1"/>
  <text class="axlbl" x="58" y="258" text-anchor="end">0</text>
  <line x1="63" y1="225" x2="68" y2="225" stroke="#94a3b8" stroke-width="1"/>
  <text class="axlbl" x="58" y="228" text-anchor="end">1</text>
  <line x1="63" y1="195" x2="68" y2="195" stroke="#94a3b8" stroke-width="1"/>
  <text class="axlbl" x="58" y="198" text-anchor="end">2</text>
  <line x1="63" y1="165" x2="68" y2="165" stroke="#94a3b8" stroke-width="1"/>
  <text class="axlbl" x="58" y="168" text-anchor="end">3</text>
  <line x1="63" y1="135" x2="68" y2="135" stroke="#94a3b8" stroke-width="1"/>
  <text class="axlbl" x="58" y="138" text-anchor="end">4</text>
  <line x1="63" y1="105" x2="68" y2="105" stroke="#94a3b8" stroke-width="1"/>
  <text class="axlbl" x="58" y="108" text-anchor="end">5</text>
  <!-- horizontal grid lines -->
  <line x1="68" y1="225" x2="335" y2="225" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="68" y1="195" x2="335" y2="195" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 3"/>
  <!-- x-axis -->
  <line x1="68" y1="255" x2="335" y2="255" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- x-axis label -->
  <text class="axlbl" x="200" y="270" text-anchor="middle">|error|</text>

  <!-- bars: each error=1, height=30px (1 unit=30px), bars from y=255-30=225 to y=255 -->
  <!-- bar width=28, gap=10, 5 bars: total=(5×28)+(4×10)=180, start=(68+335)/2-90=201-90=81 → start=82 -->
  <rect class="bar-eq" x="82"  y="225" width="28" height="30" rx="3"/>
  <rect class="bar-eq" x="120" y="225" width="28" height="30" rx="3"/>
  <rect class="bar-eq" x="158" y="225" width="28" height="30" rx="3"/>
  <rect class="bar-eq" x="196" y="225" width="28" height="30" rx="3"/>
  <rect class="bar-eq" x="234" y="225" width="28" height="30" rx="3"/>
  <!-- sample labels e1..e5 -->
  <text class="axlbl" x="96"  y="268" text-anchor="middle">e₁</text>
  <text class="axlbl" x="134" y="268" text-anchor="middle">e₂</text>
  <text class="axlbl" x="172" y="268" text-anchor="middle">e₃</text>
  <text class="axlbl" x="210" y="268" text-anchor="middle">e₄</text>
  <text class="axlbl" x="248" y="268" text-anchor="middle">e₅</text>

  <!-- metric results (left panel) -->
  <rect x="20" y="312" width="335" height="68" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text class="metric" x="100" y="334" text-anchor="middle" fill="#374151">MAE</text>
  <text class="mval" x="100" y="358" text-anchor="middle" fill="#2563eb">1.00</text>
  <line x1="175" y1="318" x2="175" y2="373" stroke="#e2e8f0" stroke-width="1"/>
  <text class="metric" x="260" y="334" text-anchor="middle" fill="#374151">RMSE</text>
  <text class="mval" x="260" y="358" text-anchor="middle" fill="#2563eb">1.00</text>
  <text class="note" x="187" y="373" text-anchor="middle">MAE = RMSE  — no outlier effect</text>

  <!-- ══ RIGHT PANEL: 1 outlier ════════════════════════════════════════════ -->
  <rect class="panel" x="385" y="52" width="335" height="250" rx="8"/>
  <text class="ptitle" x="552" y="74" text-anchor="middle">Scenario B — One Large Outlier</text>
  <text class="note" x="552" y="90" text-anchor="middle">errors = [0, 0, 0, 0, 5]</text>

  <!-- y-axis (right panel, same scale) -->
  <line x1="433" y1="100" x2="433" y2="255" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="428" y1="255" x2="433" y2="255" stroke="#94a3b8" stroke-width="1"/>
  <text class="axlbl" x="423" y="258" text-anchor="end">0</text>
  <line x1="428" y1="225" x2="433" y2="225" stroke="#94a3b8" stroke-width="1"/>
  <text class="axlbl" x="423" y="228" text-anchor="end">1</text>
  <line x1="428" y1="195" x2="433" y2="195" stroke="#94a3b8" stroke-width="1"/>
  <text class="axlbl" x="423" y="198" text-anchor="end">2</text>
  <line x1="428" y1="165" x2="433" y2="165" stroke="#94a3b8" stroke-width="1"/>
  <text class="axlbl" x="423" y="168" text-anchor="end">3</text>
  <line x1="428" y1="135" x2="433" y2="135" stroke="#94a3b8" stroke-width="1"/>
  <text class="axlbl" x="423" y="138" text-anchor="end">4</text>
  <line x1="428" y1="105" x2="433" y2="105" stroke="#94a3b8" stroke-width="1"/>
  <text class="axlbl" x="423" y="108" text-anchor="end">5</text>
  <!-- horizontal grid -->
  <line x1="433" y1="225" x2="700" y2="225" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="433" y1="195" x2="700" y2="195" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 3"/>
  <!-- x-axis -->
  <line x1="433" y1="255" x2="700" y2="255" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="axlbl" x="565" y="270" text-anchor="middle">|error|</text>

  <!-- bars for right panel: same x offsets shifted by 365 -->
  <!-- bars 1–4: near-zero height (error=0, draw 2px stub) -->
  <rect class="bar-sm" x="447"  y="253" width="28" height="2" rx="1"/>
  <rect class="bar-sm" x="485"  y="253" width="28" height="2" rx="1"/>
  <rect class="bar-sm" x="523"  y="253" width="28" height="2" rx="1"/>
  <rect class="bar-sm" x="561"  y="253" width="28" height="2" rx="1"/>
  <!-- bar 5: large error=5, height=150px (5×30) -->
  <rect class="bar-out" x="599" y="105" width="28" height="150" rx="3"/>
  <!-- value label on outlier -->
  <text x="613" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="bold" fill="#c2410c">5</text>
  <!-- x labels -->
  <text class="axlbl" x="461"  y="268" text-anchor="middle">e₁</text>
  <text class="axlbl" x="499"  y="268" text-anchor="middle">e₂</text>
  <text class="axlbl" x="537"  y="268" text-anchor="middle">e₃</text>
  <text class="axlbl" x="575"  y="268" text-anchor="middle">e₄</text>
  <text class="axlbl" x="613"  y="268" text-anchor="middle">e₅</text>

  <!-- metric results (right panel) — RMSE much larger -->
  <rect x="385" y="312" width="335" height="68" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text class="metric" x="465" y="334" text-anchor="middle" fill="#374151">MAE</text>
  <text class="mval" x="465" y="358" text-anchor="middle" fill="#2563eb">1.00</text>
  <line x1="540" y1="318" x2="540" y2="373" stroke="#e2e8f0" stroke-width="1"/>
  <text class="metric" x="625" y="334" text-anchor="middle" fill="#374151">RMSE</text>
  <text class="mval" x="625" y="358" text-anchor="middle" fill="#dc2626">2.24 ↑</text>
  <text class="note" x="552" y="373" text-anchor="middle">RMSE penalises the outlier more heavily</text>

  <!-- bottom conclusion -->
  <text x="370" y="398" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#374151">
    <tspan font-weight="bold" fill="#2563eb">MAE</tspan>
    <tspan fill="#374151"> treats all errors equally  •  </tspan>
    <tspan font-weight="bold" fill="#dc2626">RMSE</tspan>
    <tspan fill="#374151"> amplifies large errors — use RMSE when big mistakes cost more</tspan>
  </text>
</svg>
