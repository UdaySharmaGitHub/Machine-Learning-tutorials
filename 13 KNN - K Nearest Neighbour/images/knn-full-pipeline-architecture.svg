<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">KNN Preprocessing Pipeline Architecture</title>
  <desc id="desc">Architecture diagram of scikit-learn ColumnTransformer and Pipeline encapsulating numerical imputation, scaling, categorical encoding, and KNN estimator to eliminate data leakage.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 22px system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 13px system-ui, -apple-system, sans-serif; fill: #64748b; }
      .pipe-container { fill: #ffffff; stroke: #6366f1; stroke-width: 2; rx: 14; }
      .ct-container { fill: #f8faff; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 6 4; rx: 12; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 8; }
      .node-title { font: 700 13px system-ui, -apple-system, sans-serif; fill: #1e293b; }
      .node-desc { font: 400 11px system-ui, -apple-system, sans-serif; fill: #64748b; }
      .code-badge { font: 700 10px "SF Mono", Menlo, Consolas, monospace; }
      .arrow { stroke: #94a3b8; stroke-width: 2; fill: none; }
      .arrow-accent { stroke: #6366f1; stroke-width: 2; fill: none; }
      .flow-label { font: 600 11px system-ui, -apple-system, sans-serif; fill: #475569; }
      .badge-tr { fill: #ecfdf5; stroke: #a7f3d0; }
      .badge-tr-txt { font: 700 11px system-ui, -apple-system, sans-serif; fill: #047857; }
      .badge-val { fill: #eff6ff; stroke: #bfdbfe; }
      .badge-val-txt { font: 700 11px system-ui, -apple-system, sans-serif; fill: #1d4ed8; }
    </style>
    <marker id="pipe-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1L8 5L0 9z" fill="#94a3b8"/>
    </marker>
    <marker id="pipe-indigo" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1L8 5L0 9z" fill="#6366f1"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect class="bg" width="960" height="500" rx="16"/>

  <!-- Header -->
  <text class="title" x="36" y="42">Production Pipeline Architecture: Preprocessing as Part of KNN</text>
  <text class="subtitle" x="36" y="62">All transformations are fitted inside the pipeline object, guaranteeing zero statistics leak into validation folds</text>

  <!-- Input Data Stream -->
  <g transform="translate(36, 100)">
    <rect width="130" height="280" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="130" height="34" rx="10" fill="#f1f5f9"/>
    <rect x="0" y="22" width="130" height="12" fill="#f1f5f9"/>
    <text class="node-title" x="14" y="22">Raw Input X</text>

    <!-- Column visual representation -->
    <rect x="12" y="48" width="106" height="42" rx="6" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text class="node-title" x="18" y="66" fill="#0369a1" font-size="11">Numeric (p₁)</text>
    <text class="node-desc" x="18" y="82" fill="#0284c7">Age, Income, BMI...</text>

    <rect x="12" y="100" width="106" height="42" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
    <text class="node-title" x="18" y="118" fill="#b45309" font-size="11">Categorical (p₂)</text>
    <text class="node-desc" x="18" y="134" fill="#d97706">City, Tier, Gender...</text>

    <rect x="12" y="152" width="106" height="42" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text class="node-title" x="18" y="170" fill="#475569" font-size="11">Missing / Unscaled</text>
    <text class="node-desc" x="18" y="186" fill="#64748b">Raw heterogeneous</text>

    <text class="flow-label" x="14" y="240" font-size="11">Fed into single</text>
    <text class="flow-label" x="14" y="258" font-size="11" font-weight="700" fill="#4f46e5">pipeline.fit(X, y)</text>
  </g>

  <!-- Arrow into Encapsulated Pipeline -->
  <path d="M 166 170 L 195 170" class="arrow" marker-end="url(#pipe-arrow)"/>

  <!-- ==================== MAIN ENCAPSULATED PIPELINE ==================== -->
  <g transform="translate(200, 95)">
    <rect class="pipe-container" width="724" height="295"/>

    <!-- Pipeline Title Banner -->
    <rect x="0" y="0" width="724" height="32" rx="14" fill="#ede9fe"/>
    <rect x="0" y="20" width="724" height="12" fill="#ede9fe"/>
    <text class="node-title" x="16" y="22" fill="#4338ca">sklearn.pipeline.Pipeline([ ('preprocessor', ColumnTransformer(...)), ('pca', ...), ('knn', KNeighborsClassifier()) ])</text>

    <!-- COLUMN TRANSFORMER SUB-CONTAINER -->
    <g transform="translate(18, 45)">
      <rect class="ct-container" width="410" height="232"/>
      <text class="node-title" x="14" y="22" fill="#1e40af">ColumnTransformer: Branch-Specific Feature Preprocessing</text>

      <!-- NUMERIC BRANCH -->
      <g transform="translate(14, 34)">
        <rect width="180" height="88" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
        <text class="node-title" x="10" y="18" fill="#1e40af" font-size="12">1. Numeric Sub-Pipeline</text>
        <text class="code-badge" x="10" y="38" fill="#0284c7">SimpleImputer(median)</text>
        <text class="node-desc" x="10" y="52">Fills missing with tr-median</text>
        <text class="code-badge" x="10" y="68" fill="#4f46e5">RobustScaler() / Standard</text>
        <text class="node-desc" x="10" y="82">Scales variance: z = (x - μ) / σ</text>
      </g>

      <!-- CATEGORICAL BRANCH -->
      <g transform="translate(206, 34)">
        <rect width="190" height="88" rx="8" fill="#ffffff" stroke="#fde68a" stroke-width="1.2"/>
        <text class="node-title" x="10" y="18" fill="#b45309" font-size="12">2. Categorical Sub-Pipeline</text>
        <text class="code-badge" x="10" y="38" fill="#d97706">SimpleImputer(most_freq)</text>
        <text class="node-desc" x="10" y="52">Imputes missing mode</text>
        <text class="code-badge" x="10" y="68" fill="#b45309">OneHotEncoder()</text>
        <text class="node-desc" x="10" y="82">handle_unknown='ignore'</text>
      </g>

      <!-- MERGE / CONCATENATION STEP -->
      <g transform="translate(14, 136)">
        <rect width="382" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
        <text class="node-title" x="12" y="18" fill="#0f172a" font-size="12">Feature Concatenation &amp; Equal Scale</text>
        <text class="node-desc" x="12" y="34">Merges numeric + encoded one-hot vectors into a balanced Euclidean space ℝᵈ</text>
      </g>

      <!-- OPTIONAL DIM REDUCTION STEP -->
      <g transform="translate(14, 186)">
        <rect width="382" height="36" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="4 3"/>
        <text class="node-title" x="12" y="16" fill="#475569" font-size="11">Optional: PCA / TruncatedSVD / VarianceThreshold</text>
        <text class="node-desc" x="12" y="28">Compresses high-dimensional sparse features to mitigate distance concentration</text>
      </g>
    </g>

    <!-- Arrow from CT to Estimator -->
    <path d="M 436 160 L 460 160" class="arrow-indigo" marker-end="url(#pipe-indigo)"/>

    <!-- FINAL ESTIMATOR: KNN -->
    <g transform="translate(465, 45)">
      <rect width="240" height="232" rx="10" fill="#fdf4ff" stroke="#d946ef" stroke-width="1.5"/>
      <rect x="0" y="0" width="240" height="30" rx="10" fill="#fae8ff"/>
      <rect x="0" y="20" width="240" height="10" fill="#fae8ff"/>
      <text class="node-title" x="12" y="20" fill="#86198f">Final Estimator: KNN</text>

      <text class="code-badge" x="12" y="48" fill="#701a75">KNeighborsClassifier(</text>
      <text class="code-badge" x="22" y="64" fill="#a21caf">n_neighbors = k,</text>
      <text class="code-badge" x="22" y="80" fill="#a21caf">weights = 'distance',</text>
      <text class="code-badge" x="22" y="96" fill="#a21caf">metric = 'manhattan',</text>
      <text class="code-badge" x="22" y="112" fill="#a21caf">algorithm = 'ball_tree')</text>

      <!-- Fitted Index Internal Structure -->
      <g transform="translate(12, 126)">
        <rect width="216" height="94" rx="6" fill="#ffffff" stroke="#f0abfc"/>
        <text class="node-title" x="8" y="18" fill="#701a75" font-size="11">Internal Search Tree Built:</text>
        <text class="node-desc" x="8" y="34">• Stores scaled training matrix</text>
        <text class="node-desc" x="8" y="50">• Hierarchical bounding balls</text>
        <text class="node-desc" x="8" y="66">• Query searches in O(d log n)</text>
        <text class="code-badge" x="8" y="84" fill="#047857">Predict: Vote / Mean</text>
      </g>
    </g>
  </g>

  <!-- Output Prediction -->
  <path d="M 924 240 L 945 240" class="arrow-indigo" marker-end="url(#pipe-indigo)"/>

  <!-- Bottom Explanatory Comparison: fit() vs predict() -->
  <g transform="translate(36, 406)">
    <!-- FIT PHASE -->
    <g transform="translate(0, 0)">
      <rect class="badge-tr" width="430" height="78" rx="8"/>
      <text class="badge-tr-txt" x="14" y="22">fit(X_train, y_train): Learn &amp; Memorize</text>
      <text class="node-desc" x="14" y="42" fill="#065f46">• Computes median &amp; mean/std (μ, σ) on training fold only.</text>
      <text class="node-desc" x="14" y="58" fill="#065f46">• Memorizes categories &amp; builds spatial Ball/KD tree index.</text>
      <text class="node-desc" x="14" y="72" fill="#065f46">• Guarantees zero contamination from validation or holdout data.</text>
    </g>

    <!-- PREDICT PHASE -->
    <g transform="translate(458, 0)">
      <rect class="badge-val" width="430" height="78" rx="8"/>
      <text class="badge-val-txt" x="14" y="22">predict(X_new): Transform &amp; Query</text>
      <text class="node-desc" x="14" y="42" fill="#1e40af">• Transforms incoming query using frozen statistics (μ_train, σ_train).</text>
      <text class="node-desc" x="14" y="58" fill="#1e40af">• Drops unknown category levels silently (handle_unknown='ignore').</text>
      <text class="node-desc" x="14" y="72" fill="#1e40af">• Queries nearest k neighbors in index; aggregates labels/values.</text>
    </g>
  </g>
</svg>