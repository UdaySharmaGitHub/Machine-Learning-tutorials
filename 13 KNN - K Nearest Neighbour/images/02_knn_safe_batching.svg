<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<title>KNN safe batching: block both dimensions</title><desc>Query-only batching still compares each query batch with all n training rows; block the training set too.</desc>
<defs>
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #172033; }
    .title { font-size: 34px; font-weight: 750; }
    .subtitle { font-size: 17px; fill: #536078; }
    .h { font-size: 22px; font-weight: 700; }
    .body { font-size: 17px; }
    .small { font-size: 14px; fill: #536078; }
    .tiny { font-size: 12px; fill: #64748b; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .panel { fill: #ffffff; stroke: #d9e0ea; stroke-width: 2; }
    .line { stroke: #cbd5e1; stroke-width: 2; }
    .blue { fill: #2563eb; } .blueStroke { stroke: #2563eb; }
    .teal { fill: #0f9d8a; } .tealStroke { stroke: #0f9d8a; }
    .orange { fill: #e8792e; } .orangeStroke { stroke: #e8792e; }
    .purple { fill: #7656c9; } .purpleStroke { stroke: #7656c9; }
    .red { fill: #dc5656; } .redStroke { stroke: #dc5656; }
    .muted { fill: #eef2f7; }
  </style>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
</defs>
<rect width="1200" height="760" fill="#f6f8fc"/>
<text x="60" y="66" class="title">KNN safe batching: block both dimensions</text>
<text x="60" y="98" class="subtitle">Query-only batching still compares each query batch with all n training rows; block the training set too.</text>
<rect x="55" y="130" width="520" height="550" rx="18" class="panel"/><rect x="625" y="130" width="520" height="550" rx="18" class="panel"/><text x="85" y="175" class="h">A. Query-only batching</text><text x="85" y="212" class="body">Batch b queries × all n training rows</text><rect x="90" y="250" width="48" height="34" rx="4" fill="#dbeafe" stroke="#9aa9bd"/><rect x="147" y="250" width="48" height="34" rx="4" fill="#dbeafe" stroke="#9aa9bd"/><rect x="204" y="250" width="48" height="34" rx="4" fill="#dbeafe" stroke="#9aa9bd"/><rect x="261" y="250" width="48" height="34" rx="4" fill="#dbeafe" stroke="#9aa9bd"/><rect x="318" y="250" width="48" height="34" rx="4" fill="#dbeafe" stroke="#9aa9bd"/><rect x="375" y="250" width="48" height="34" rx="4" fill="#dbeafe" stroke="#9aa9bd"/><rect x="432" y="250" width="48" height="34" rx="4" fill="#fef0dc" stroke="#9aa9bd"/><rect x="90" y="298" width="48" height="34" rx="4" fill="#dbeafe" stroke="#9aa9bd"/><rect x="147" y="298" width="48" height="34" rx="4" fill="#dbeafe" stroke="#9aa9bd"/><rect x="204" y="298" width="48" height="34" rx="4" fill="#dbeafe" stroke="#9aa9bd"/><rect x="261" y="298" width="48" height="34" rx="4" fill="#dbeafe" stroke="#9aa9bd"/><rect x="318" y="298" width="48" height="34" rx="4" fill="#dbeafe" stroke="#9aa9bd"/><rect x="375" y="298" width="48" height="34" rx="4" fill="#dbeafe" stroke="#9aa9bd"/><rect x="432" y="298" width="48" height="34" rx="4" fill="#fef0dc" stroke="#9aa9bd"/><rect x="90" y="346" width="48" height="34" rx="4" fill="#dbeafe" stroke="#9aa9bd"/><rect x="147" y="346" width="48" height="34" rx="4" fill="#dbeafe" stroke="#9aa9bd"/><rect x="204" y="346" width="48" height="34" rx="4" fill="#dbeafe" stroke="#9aa9bd"/><rect x="261" y="346" width="48" height="34" rx="4" fill="#dbeafe" stroke="#9aa9bd"/><rect x="318" y="346" width="48" height="34" rx="4" fill="#dbeafe" stroke="#9aa9bd"/><rect x="375" y="346" width="48" height="34" rx="4" fill="#dbeafe" stroke="#9aa9bd"/><rect x="432" y="346" width="48" height="34" rx="4" fill="#fef0dc" stroke="#9aa9bd"/><rect x="90" y="394" width="48" height="34" rx="4" fill="#dbeafe" stroke="#9aa9bd"/><rect x="147" y="394" width="48" height="34" rx="4" fill="#dbeafe" stroke="#9aa9bd"/><rect x="204" y="394" width="48" height="34" rx="4" fill="#dbeafe" stroke="#9aa9bd"/><rect x="261" y="394" width="48" height="34" rx="4" fill="#dbeafe" stroke="#9aa9bd"/><rect x="318" y="394" width="48" height="34" rx="4" fill="#dbeafe" stroke="#9aa9bd"/><rect x="375" y="394" width="48" height="34" rx="4" fill="#dbeafe" stroke="#9aa9bd"/><rect x="432" y="394" width="48" height="34" rx="4" fill="#fef0dc" stroke="#9aa9bd"/><path d="M88 242 L490 242" stroke="#2563eb" stroke-width="4"/><text x="90" y="475" class="body mono">Working distances: O(b n)</text><text x="90" y="510" class="small">Batching queries alone does not remove</text><text x="90" y="534" class="small">the full training-set dimension.</text><rect x="90" y="570" width="420" height="58" rx="10" fill="#fff1f0" stroke="#efaaa4"/><text x="110" y="606" class="body" fill="#b42318">Still too large when n is huge</text><text x="655" y="175" class="h">B. Blockwise top-K merging</text><text x="655" y="212" class="body">Query block b × training block t</text><rect x="660" y="250" width="66" height="48" rx="6" fill="#dbeafe" stroke="#8aa0b8"/><rect x="737" y="250" width="66" height="48" rx="6" fill="#e7f6f2" stroke="#8aa0b8"/><rect x="814" y="250" width="66" height="48" rx="6" fill="#dbeafe" stroke="#8aa0b8"/><rect x="891" y="250" width="66" height="48" rx="6" fill="#e7f6f2" stroke="#8aa0b8"/><rect x="660" y="312" width="66" height="48" rx="6" fill="#e7f6f2" stroke="#8aa0b8"/><rect x="737" y="312" width="66" height="48" rx="6" fill="#dbeafe" stroke="#8aa0b8"/><rect x="814" y="312" width="66" height="48" rx="6" fill="#e7f6f2" stroke="#8aa0b8"/><rect x="891" y="312" width="66" height="48" rx="6" fill="#dbeafe" stroke="#8aa0b8"/><rect x="660" y="374" width="66" height="48" rx="6" fill="#dbeafe" stroke="#8aa0b8"/><rect x="737" y="374" width="66" height="48" rx="6" fill="#e7f6f2" stroke="#8aa0b8"/><rect x="814" y="374" width="66" height="48" rx="6" fill="#dbeafe" stroke="#8aa0b8"/><rect x="891" y="374" width="66" height="48" rx="6" fill="#e7f6f2" stroke="#8aa0b8"/><text x="660" y="465" class="body">For each query, keep current best K</text><rect x="660" y="485" width="420" height="54" rx="10" fill="#f0ebff" stroke="#b6a5ee"/><text x="680" y="519" class="body mono">Current top-K: O(b K)</text><path d="M870 545 L870 574" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="660" y="582" width="420" height="58" rx="10" fill="#e9f7f4" stroke="#8bd2c4"/><text x="680" y="618" class="body mono">Working memory: O(b t + b K)</text><text x="655" y="665" class="small">Repeat over training blocks; merge candidates; return final K.</text></svg>