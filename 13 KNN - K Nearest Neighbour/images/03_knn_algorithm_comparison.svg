<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<title>KNN neighbour-search algorithms</title><desc>Conceptual comparison: exact methods guarantee true nearest neighbours; ANN methods trade exactness for speed.</desc>
<defs>
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #172033; }
    .title { font-size: 34px; font-weight: 750; }
    .subtitle { font-size: 17px; fill: #536078; }
    .h { font-size: 22px; font-weight: 700; }
    .body { font-size: 17px; }
    .small { font-size: 14px; fill: #536078; }
    .tiny { font-size: 12px; fill: #64748b; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .panel { fill: #ffffff; stroke: #d9e0ea; stroke-width: 2; }
    .line { stroke: #cbd5e1; stroke-width: 2; }
    .blue { fill: #2563eb; } .blueStroke { stroke: #2563eb; }
    .teal { fill: #0f9d8a; } .tealStroke { stroke: #0f9d8a; }
    .orange { fill: #e8792e; } .orangeStroke { stroke: #e8792e; }
    .purple { fill: #7656c9; } .purpleStroke { stroke: #7656c9; }
    .red { fill: #dc5656; } .redStroke { stroke: #dc5656; }
    .muted { fill: #eef2f7; }
  </style>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
</defs>
<rect width="1200" height="760" fill="#f6f8fc"/>
<text x="60" y="66" class="title">KNN neighbour-search algorithms</text>
<text x="60" y="98" class="subtitle">Conceptual comparison: exact methods guarantee true nearest neighbours; ANN methods trade exactness for speed.</text>
<rect x="55" y="130" width="1090" height="550" rx="18" class="panel"/><text x="85" y="178" class="h">How to read the comparison</text><text x="90" y="220" class="body" font-weight="700">Method</text><text x="390" y="220" class="body" font-weight="700">Build / index</text><text x="650" y="220" class="body" font-weight="700">Query behaviour</text><text x="950" y="220" class="body" font-weight="700">Exact?</text><line x1="85" y1="235" x2="1110" y2="235" class="line"/><rect x="78" y="249" width="1035" height="48" rx="8" fill="#f5f8fc"/><circle cx="98" cy="273" r="7" fill="#2563eb"/><text x="118" y="279" class="body" font-weight="650">Brute force</text><text x="390" y="279" class="small">Store data; little/no index</text><text x="650" y="279" class="small">O(n d) distance work per query</text><text x="970" y="279" class="body" font-weight="700">Yes</text><rect x="78" y="311" width="1035" height="48" rx="8" fill="#ffffff"/><circle cx="98" cy="335" r="7" fill="#0f9d8a"/><text x="118" y="341" class="body" font-weight="650">KD-Tree</text><text x="390" y="341" class="small">Typically O(n log n)</text><text x="650" y="341" class="small">Often fast in low dimensions; worst O(n d)</text><text x="970" y="341" class="body" font-weight="700">Yes</text><rect x="78" y="373" width="1035" height="48" rx="8" fill="#f5f8fc"/><circle cx="98" cy="397" r="7" fill="#0f9d8a"/><text x="118" y="403" class="body" font-weight="650">Ball Tree</text><text x="390" y="403" class="small">Typically O(n log n)</text><text x="650" y="403" class="small">Depends on pruning; worst O(n d)</text><text x="970" y="403" class="body" font-weight="700">Yes</text><rect x="78" y="435" width="1035" height="48" rx="8" fill="#ffffff"/><circle cx="98" cy="459" r="7" fill="#7656c9"/><text x="118" y="465" class="body" font-weight="650">HNSW</text><text x="390" y="465" class="small">Graph construction; often ~O(n log n)</text><text x="650" y="465" class="small">Often empirically sublinear; config-dependent</text><text x="970" y="465" class="body" font-weight="700">No</text><rect x="78" y="497" width="1035" height="48" rx="8" fill="#f5f8fc"/><circle cx="98" cy="521" r="7" fill="#7656c9"/><text x="118" y="527" class="body" font-weight="650">IVF + PQ</text><text x="390" y="527" class="small">Clustering + quantization</text><text x="650" y="527" class="small">Depends on nprobe / scanned lists</text><text x="970" y="527" class="body" font-weight="700">No</text><rect x="78" y="559" width="1035" height="48" rx="8" fill="#ffffff"/><circle cx="98" cy="583" r="7" fill="#7656c9"/><text x="118" y="589" class="body" font-weight="650">LSH</text><text x="390" y="589" class="small">Hash tables; data-dependent</text><text x="650" y="589" class="small">Depends on tables and bucket sizes</text><text x="970" y="589" class="body" font-weight="700">No</text><line x1="85" y1="650" x2="1110" y2="650" class="line"/><text x="90" y="675" class="small">Complexities are typical descriptions, not universal guarantees. ANN performance depends on data, implementation and parameters.</text></svg>