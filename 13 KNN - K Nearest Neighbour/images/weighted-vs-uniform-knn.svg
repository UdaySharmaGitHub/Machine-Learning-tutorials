<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570" role="img" aria-labelledby="title desc">
  <title id="title">Uniform KNN versus Distance-Weighted KNN</title>
  <desc id="desc">Comparison showing how uniform voting can be fooled by distant majority neighbors, while distance weighting gives correct predictions by prioritizing proximity.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
      .title { font: 700 22px system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 13px system-ui, -apple-system, sans-serif; fill: #64748b; }
      .card-title { font: 700 16px system-ui, -apple-system, sans-serif; fill: #1e293b; }
      .card-sub { font: 500 12px system-ui, -apple-system, sans-serif; fill: #64748b; }
      .label { font: 600 12px system-ui, -apple-system, sans-serif; fill: #334155; }
      .small { font: 500 11px system-ui, -apple-system, sans-serif; fill: #64748b; }
      .badge-txt { font: 700 11px system-ui, -apple-system, sans-serif; }
      .formula { font: 600 12px "SF Mono", Menlo, Consolas, monospace; fill: #475569; }
      .grid { stroke: #f1f5f9; stroke-width: 1; }
      .axis { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .ring { fill: none; stroke: #8b5cf6; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .query-outer { fill: #f8fafc; stroke: #0f172a; stroke-width: 3; }
      .query-dot { fill: #0f172a; }
      .class-a { fill: #2563eb; stroke: #1d4ed8; stroke-width: 1.5; }
      .class-b { fill: #f97316; stroke: #c2410c; stroke-width: 1.5; }
    </style>

    <!-- Markers -->
    <marker id="arrow-uni" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 1L8 5L0 9z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-heavy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1L8 5L0 9z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-med" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 1L8 5L0 9z" fill="#f97316"/>
    </marker>
    <marker id="arrow-light" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 1L8 5L0 9z" fill="#93c5fd"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect class="bg" width="960" height="570" rx="16"/>

  <!-- Main Header -->
  <text class="title" x="36" y="42">Uniform KNN vs. Distance-Weighted KNN (k = 5)</text>
  <text class="subtitle" x="36" y="62">Why weighting by inverse distance prevents far-away clusters from overriding close, relevant neighbors</text>

  <!-- ==================== LEFT CARD: UNIFORM KNN ==================== -->
  <g transform="translate(36, 82)">
    <rect class="card" width="432" height="420" rx="14"/>

    <!-- Header Box -->
    <rect x="0" y="0" width="432" height="56" rx="14" fill="#f1f5f9"/>
    <rect x="0" y="44" width="432" height="12" fill="#f1f5f9"/>
    <text class="card-title" x="20" y="28">Standard Uniform KNN</text>
    <text class="card-sub" x="20" y="46">Equal Voting: Each neighbor gets weight w = 1.0 regardless of distance</text>

    <!-- Coordinate Grid Simulation -->
    <g opacity="0.8">
      <circle class="ring" cx="190" cy="180" r="115"/>
      <text class="small" x="180" y="58" text-anchor="middle" fill="#8b5cf6">k = 5 neighborhood radius</text>
    </g>

    <!-- Query Point -->
    <line x1="190" y1="180" x2="155" y2="155" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-uni)"/>
    <line x1="190" y1="180" x2="205" y2="135" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-uni)"/>
    <line x1="190" y1="180" x2="275" y2="130" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-uni)"/>
    <line x1="190" y1="180" x2="285" y2="205" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-uni)"/>
    <line x1="190" y1="180" x2="255" y2="255" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-uni)"/>

    <!-- Data Points -->
    <!-- Class B: 2 very close Orange squares -->
    <rect class="class-b" x="146" y="146" width="18" height="18" rx="3"/>
    <text class="small" x="138" y="140" font-weight="600" fill="#c2410c">d₁=0.4</text>
    
    <rect class="class-b" x="196" y="126" width="18" height="18" rx="3"/>
    <text class="small" x="188" y="120" font-weight="600" fill="#c2410c">d₂=0.6</text>

    <!-- Class A: 3 distant Blue circles -->
    <circle class="class-a" cx="282" cy="130" r="10"/>
    <text class="small" x="296" y="130" font-weight="600" fill="#1d4ed8">d₃=2.3</text>

    <circle class="class-a" cx="292" cy="208" r="10"/>
    <text class="small" x="306" y="210" font-weight="600" fill="#1d4ed8">d₄=2.5</text>

    <circle class="class-a" cx="260" cy="262" r="10"/>
    <text class="small" x="274" y="268" font-weight="600" fill="#1d4ed8">d₅=2.6</text>

    <!-- Query Point Center -->
    <circle class="query-outer" cx="190" cy="180" r="12"/>
    <circle class="query-dot" cx="190" cy="180" r="4"/>
    <text class="small" x="190" y="206" text-anchor="middle" font-weight="700" fill="#0f172a">Query x_q</text>

    <!-- Tally & Prediction Box -->
    <rect x="20" y="306" width="392" height="96" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text class="label" x="32" y="328">Voting Tally (w = 1 per neighbor):</text>
    
    <!-- Class A votes -->
    <circle class="class-a" cx="42" cy="348" r="6"/>
    <text class="small" x="54" y="352">Class A (Blue): 3 votes</text>
    
    <!-- Class B votes -->
    <rect class="class-b" x="192" y="342" width="12" height="12" rx="2"/>
    <text class="small" x="210" y="352">Class B (Orange): 2 votes</text>

    <!-- Result Pill -->
    <rect x="32" y="366" width="368" height="26" rx="6" fill="#fee2e2" stroke="#fca5a5"/>
    <text class="badge-txt" x="42" y="383" fill="#991b1b">⚠️ Predicts Class A (Majority: 3 vs 2) — Ignored proximity!</text>
  </g>

  <!-- ==================== RIGHT CARD: WEIGHTED KNN ==================== -->
  <g transform="translate(492, 82)">
    <rect class="card" width="432" height="420" rx="14"/>

    <!-- Header Box -->
    <rect x="0" y="0" width="432" height="56" rx="14" fill="#eff6ff"/>
    <rect x="0" y="44" width="432" height="12" fill="#eff6ff"/>
    <text class="card-title" x="20" y="28" fill="#1e40af">Distance-Weighted KNN</text>
    <text class="card-sub" x="20" y="46" fill="#3b82f6">Inverse Distance: Weight w_i = 1 / d_i² decay gives power to close points</text>

    <!-- Coordinate Grid Simulation -->
    <g opacity="0.8">
      <circle class="ring" cx="190" cy="180" r="115"/>
      <text class="small" x="180" y="58" text-anchor="middle" fill="#8b5cf6">k = 5 neighborhood radius</text>
    </g>

    <!-- Query Point Arrows with PROPORTIONAL THICKNESS -->
    <!-- To Orange 1: d=0.4 => w = 1/0.16 = 6.25 (Very Thick) -->
    <line x1="190" y1="180" x2="155" y2="155" stroke="#ea580c" stroke-width="4.5" marker-end="url(#arrow-heavy)"/>
    <!-- To Orange 2: d=0.6 => w = 1/0.36 = 2.78 (Medium-Thick) -->
    <line x1="190" y1="180" x2="205" y2="135" stroke="#f97316" stroke-width="3" marker-end="url(#arrow-med)"/>
    
    <!-- To Blue points: d ~ 2.5 => w ~ 0.16 (Very Thin, Faint) -->
    <line x1="190" y1="180" x2="275" y2="130" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arrow-light)"/>
    <line x1="190" y1="180" x2="285" y2="205" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arrow-light)"/>
    <line x1="190" y1="180" x2="255" y2="255" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arrow-light)"/>

    <!-- Data Points with Weights -->
    <!-- Class B: Orange -->
    <rect class="class-b" x="146" y="146" width="18" height="18" rx="3" stroke="#ea580c" stroke-width="2"/>
    <rect x="100" y="128" width="54" height="18" rx="4" fill="#ffedd5" stroke="#fed7aa"/>
    <text class="badge-txt" x="127" y="141" text-anchor="middle" fill="#c2410c">w = 6.25</text>

    <rect class="class-b" x="196" y="126" width="18" height="18" rx="3" stroke="#ea580c" stroke-width="2"/>
    <rect x="180" y="98" width="54" height="18" rx="4" fill="#ffedd5" stroke="#fed7aa"/>
    <text class="badge-txt" x="207" y="111" text-anchor="middle" fill="#c2410c">w = 2.78</text>

    <!-- Class A: Blue -->
    <circle class="class-a" cx="282" cy="130" r="10" opacity="0.75"/>
    <text class="small" x="300" y="132" fill="#64748b">w = 0.19</text>

    <circle class="class-a" cx="292" cy="208" r="10" opacity="0.75"/>
    <text class="small" x="310" y="210" fill="#64748b">w = 0.16</text>

    <circle class="class-a" cx="260" cy="262" r="10" opacity="0.75"/>
    <text class="small" x="278" y="268" fill="#64748b">w = 0.15</text>

    <!-- Query Point Center -->
    <circle class="query-outer" cx="190" cy="180" r="12"/>
    <circle class="query-dot" cx="190" cy="180" r="4"/>
    <text class="small" x="190" y="206" text-anchor="middle" font-weight="700" fill="#0f172a">Query x_q</text>

    <!-- Tally & Prediction Box -->
    <rect x="20" y="306" width="392" height="96" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text class="label" x="32" y="328">Weighted Score Sum Σ w_i:</text>
    
    <!-- Class B score -->
    <rect class="class-b" x="32" y="342" width="12" height="12" rx="2"/>
    <text class="small" x="50" y="352"><strong>Class B (Orange):</strong> 6.25 + 2.78 = <strong>9.03</strong></text>

    <!-- Class A score -->
    <circle class="class-a" cx="236" cy="348" r="6"/>
    <text class="small" x="248" y="352"><strong>Class A (Blue):</strong> 0.19 + 0.16 + 0.15 = <strong>0.50</strong></text>

    <!-- Result Pill -->
    <rect x="32" y="366" width="368" height="26" rx="6" fill="#dcfce7" stroke="#86efac"/>
    <text class="badge-txt" x="42" y="383" fill="#15803d">✅ Predicts Class B (Score: 9.03 vs 0.50) — Proximity wins!</text>
  </g>

  <!-- Bottom Key Takeaway Strip -->
  <g transform="translate(36, 514)">
    <rect width="888" height="38" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text class="small" x="20" y="24" fill="#334155"><tspan font-weight="700" fill="#0f172a">Key Insight:</tspan> Distance weighting ensures that a few immediate, high-confidence neighbors are not overwhelmed by a distant swarm of irrelevant points.</text>
  </g>
</svg>