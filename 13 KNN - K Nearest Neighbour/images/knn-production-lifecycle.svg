<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="title desc">
  <title id="title">KNN Production Serving, Monitoring, and Index Rebuild Lifecycle</title>
  <desc id="desc">Complete production deployment architecture for KNN models illustrating pipeline serialization, low-latency API serving, live OOD and drift monitoring, and dynamic index rebuilding.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 22px system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 13px system-ui, -apple-system, sans-serif; fill: #64748b; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 12; }
      .card-title { font: 700 14px system-ui, -apple-system, sans-serif; fill: #1e293b; }
      .node-title { font: 700 12px system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .node-desc { font: 400 11px system-ui, -apple-system, sans-serif; fill: #475569; }
      .code-badge { font: 700 10px "SF Mono", Menlo, Consolas, monospace; }
      .badge-hdr { rx: 12; }
      .badge-txt { font: 700 11px system-ui, -apple-system, sans-serif; }
      .arrow { stroke: #94a3b8; stroke-width: 2; fill: none; }
      .arrow-indigo { stroke: #6366f1; stroke-width: 2; fill: none; }
      .arrow-green { stroke: #10b981; stroke-width: 2; fill: none; }
      .arrow-loop { stroke: #f59e0b; stroke-width: 2; stroke-dasharray: 5 4; fill: none; }
    </style>
    <marker id="prod-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1L8 5L0 9z" fill="#94a3b8"/>
    </marker>
    <marker id="prod-indigo" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1L8 5L0 9z" fill="#6366f1"/>
    </marker>
    <marker id="prod-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1L8 5L0 9z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect class="bg" width="960" height="510" rx="16"/>

  <!-- Header -->
  <text class="title" x="36" y="42">KNN in Production: Serving, Telemetry &amp; Index Rebuilding</text>
  <text class="subtitle" x="36" y="62">From offline serialized artifact to low-latency inference, real-time OOD monitoring, and automated retraining</text>

  <!-- ==================== STAGE 1: SERIALIZATION ==================== -->
  <g transform="translate(36, 85)">
    <rect class="card" width="200" height="340"/>
    <rect x="0" y="0" width="200" height="36" rx="12" fill="#eff6ff"/>
    <rect x="0" y="24" width="200" height="12" fill="#eff6ff"/>
    <text class="badge-txt" x="14" y="24" fill="#1d4ed8">1. Artifact Serialization</text>

    <!-- Sub-elements -->
    <g transform="translate(12, 48)">
      <rect width="176" height="52" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
      <text class="node-title" x="8" y="18">Single Immutable File</text>
      <text class="code-badge" x="8" y="34" fill="#4338ca">joblib.dump(pipeline)</text>
      <text class="node-desc" x="8" y="46">Scaler + Tree + KNN</text>
    </g>

    <g transform="translate(12, 110)">
      <rect width="176" height="74" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
      <text class="node-title" x="8" y="18">Included Metadata</text>
      <text class="node-desc" x="8" y="34">• Calibrated τ₉₉ threshold</text>
      <text class="node-desc" x="8" y="50">• Feature column names</text>
      <text class="node-desc" x="8" y="66">• Test benchmark &amp; latency</text>
    </g>

    <g transform="translate(12, 194)">
      <rect width="176" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
      <text class="node-title" x="8" y="18">Storage &amp; Registry</text>
      <text class="node-desc" x="8" y="34">Model registry (MLflow / S3)</text>
      <text class="node-desc" x="8" y="50">Versioned pipeline binary</text>
    </g>

    <g transform="translate(12, 264)">
      <rect width="176" height="64" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
      <text class="node-title" x="8" y="18" fill="#1e40af">Zero-Mismatch Guarantee</text>
      <text class="node-desc" x="8" y="34" fill="#1e3a8a">Serving code cannot drift</text>
      <text class="node-desc" x="8" y="50" fill="#1e3a8a">from training preprocessing</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 236 240 L 260 240" class="arrow" marker-end="url(#prod-arrow)"/>

  <!-- ==================== STAGE 2: INFERENCE SERVING ENGINE ==================== -->
  <g transform="translate(265, 85)">
    <rect class="card" width="215" height="340"/>
    <rect x="0" y="0" width="215" height="36" rx="12" fill="#ede9fe"/>
    <rect x="0" y="24" width="215" height="12" fill="#ede9fe"/>
    <text class="badge-txt" x="14" y="24" fill="#5b21b6">2. Real-Time Inference</text>

    <!-- Sub-elements -->
    <g transform="translate(12, 48)">
      <rect width="191" height="52" rx="6" fill="#f8fafc" stroke="#c7d2fe"/>
      <text class="node-title" x="8" y="18">Incoming Request</text>
      <text class="code-badge" x="8" y="34" fill="#475569">POST /v1/predict {"x": ...}</text>
      <text class="node-desc" x="8" y="46">Single row or micro-batch</text>
    </g>

    <g transform="translate(12, 110)">
      <rect width="191" height="52" rx="6" fill="#f8fafc" stroke="#c7d2fe"/>
      <text class="node-title" x="8" y="18">Pipeline Transform</text>
      <text class="code-badge" x="8" y="34" fill="#4338ca">pipeline.transform(X)</text>
      <text class="node-desc" x="8" y="46">Frozen μ &amp; σ applied</text>
    </g>

    <g transform="translate(12, 172)">
      <rect width="191" height="66" rx="6" fill="#fdf4ff" stroke="#f0abfc"/>
      <text class="node-title" x="8" y="18" fill="#86198f">Index Search (KD / Ball)</text>
      <text class="node-desc" x="8" y="34">• Memory-mapped RAM</text>
      <text class="node-desc" x="8" y="50">• O(d log n) tree pruning</text>
      <text class="code-badge" x="8" y="62" fill="#701a75">dist, idx = kneighbors()</text>
    </g>

    <g transform="translate(12, 248)">
      <rect width="191" height="80" rx="6" fill="#fff1f2" stroke="#fda4af"/>
      <text class="node-title" x="8" y="18" fill="#9f1239">OOD Novelty Guardrail</text>
      <text class="node-desc" x="8" y="34">• Check <tspan font-family="monospace">r_k &gt; tau_99</tspan></text>
      <text class="node-desc" x="8" y="50">• If OOD: trigger fallback</text>
      <text class="node-desc" x="8" y="66" font-weight="700" fill="#be123c">• If In-Dist: output vote/mean</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 480 240 L 505 240" class="arrow-indigo" marker-end="url(#prod-indigo)"/>

  <!-- ==================== STAGE 3: TELEMETRY & MONITORING ==================== -->
  <g transform="translate(510, 85)">
    <rect class="card" width="205" height="340"/>
    <rect x="0" y="0" width="205" height="36" rx="12" fill="#ecfdf5"/>
    <rect x="0" y="24" width="205" height="12" fill="#ecfdf5"/>
    <text class="badge-txt" x="14" y="24" fill="#065f46">3. Telemetry &amp; Monitoring</text>

    <!-- Sub-elements -->
    <g transform="translate(12, 48)">
      <rect width="181" height="60" rx="6" fill="#f8fafc" stroke="#a7f3d0"/>
      <text class="node-title" x="8" y="18">Neighbor Distance Shift</text>
      <text class="node-desc" x="8" y="34">Rolling mean of r_k(x):</text>
      <text class="node-desc" x="8" y="50" fill="#b45309" font-weight="600">Rising r_k = Feature Drift!</text>
    </g>

    <g transform="translate(12, 118)">
      <rect width="181" height="60" rx="6" fill="#f8fafc" stroke="#a7f3d0"/>
      <text class="node-title" x="8" y="18">Latency SLA Tracking</text>
      <text class="node-desc" x="8" y="34">p50, p95, p99 ms per query.</text>
      <text class="node-desc" x="8" y="50">Alert if p99 &gt; SLA budget</text>
    </g>

    <g transform="translate(12, 188)">
      <rect width="181" height="60" rx="6" fill="#f8fafc" stroke="#a7f3d0"/>
      <text class="node-title" x="8" y="18">RAM Footprint</text>
      <text class="node-desc" x="8" y="34">KNN stores training set.</text>
      <text class="node-desc" x="8" y="50">Monitor memory saturation</text>
    </g>

    <g transform="translate(12, 258)">
      <rect width="181" height="70" rx="6" fill="#f8fafc" stroke="#a7f3d0"/>
      <text class="node-title" x="8" y="18">Ground-Truth Audit</text>
      <text class="node-desc" x="8" y="34">Sample 5% of served calls</text>
      <text class="node-desc" x="8" y="50">Collect actual labels</text>
      <text class="node-desc" x="8" y="64" fill="#047857" font-weight="600">Detect accuracy decay</text>
    </g>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 715 240 L 738 240" class="arrow" marker-end="url(#prod-arrow)"/>

  <!-- ==================== STAGE 4: INDEX REBUILD POLICY ==================== -->
  <g transform="translate(743, 85)">
    <rect class="card" width="181" height="340"/>
    <rect x="0" y="0" width="181" height="36" rx="12" fill="#fffbeb"/>
    <rect x="0" y="24" width="181" height="12" fill="#fffbeb"/>
    <text class="badge-txt" x="12" y="24" fill="#92400e">4. Index Rebuild Loop</text>

    <!-- Sub-elements -->
    <g transform="translate(10, 48)">
      <rect width="161" height="68" rx="6" fill="#f8fafc" stroke="#fde68a"/>
      <text class="node-title" x="8" y="18">Rebuild Triggers</text>
      <text class="node-desc" x="8" y="34">• Scheduled (Weekly)</text>
      <text class="node-desc" x="8" y="48">• Significant data drift</text>
      <text class="node-desc" x="8" y="62">• High volume of new labels</text>
    </g>

    <g transform="translate(10, 126)">
      <rect width="161" height="78" rx="6" fill="#f8fafc" stroke="#fde68a"/>
      <text class="node-title" x="8" y="18">Batch Re-indexing</text>
      <text class="node-desc" x="8" y="34">• Refit scaler &amp; encoder</text>
      <text class="node-desc" x="8" y="48">• Reconstruct tree index</text>
      <text class="node-desc" x="8" y="62">• Recalibrate τ₉₉ threshold</text>
      <text class="node-desc" x="8" y="74">• Validate regression test</text>
    </g>

    <g transform="translate(10, 214)">
      <rect width="161" height="68" rx="6" fill="#f8fafc" stroke="#fde68a"/>
      <text class="node-title" x="8" y="18">Hot Swap Deployment</text>
      <text class="node-desc" x="8" y="34">Atomic pointer swap to</text>
      <text class="node-desc" x="8" y="48">new index in memory</text>
      <text class="node-desc" x="8" y="62" fill="#047857" font-weight="600">Zero downtime!</text>
    </g>

    <g transform="translate(10, 290)">
      <rect width="161" height="38" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
      <text class="node-desc" x="8" y="16" fill="#b45309" font-weight="700">Continuous Sync</text>
      <text class="node-desc" x="8" y="30" fill="#92400e">Retains neighborhood freshness</text>
    </g>
  </g>

  <!-- Retraining Feedback Loop Arrow back to Serialization -->
  <path d="M 833 85 L 833 65 L 136 65 L 136 85" class="arrow-loop" marker-end="url(#prod-amber)"/>
  <rect x="420" y="54" width="130" height="20" rx="4" fill="#ffffff" stroke="#f59e0b"/>
  <text class="code-badge" x="428" y="68" fill="#b45309">Automated Retrain Loop</text>

  <!-- Bottom Recommendation Bar -->
  <g transform="translate(36, 440)">
    <rect width="888" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text class="node-title" x="18" y="22" fill="#0f172a">Production Operational Rule:</text>
    <text class="node-desc" x="18" y="40">Never serve raw un-encapsulated models. By saving the Pipeline object, feature scaling and categorical imputation parameters stay synchronized forever, eliminating 99% of machine learning production bugs.</text>
  </g>
</svg>