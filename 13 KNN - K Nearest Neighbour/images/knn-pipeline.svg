<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" viewBox="0 0 1080 420" role="img" aria-labelledby="title desc">
  <title id="title">Leakage-Safe End-to-End KNN Modelling Workflow</title>
  <desc id="desc">Comprehensive architecture diagram illustrating holdout splitting, cross-validation with internal pipeline fitting, joint tuning, final test evaluation, and production deployment with out-of-distribution guardrails.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 22px system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 13px system-ui, -apple-system, sans-serif; fill: #64748b; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 12; }
      .card-cv { fill: #fbfcfe; stroke: #c7d2fe; stroke-width: 1.5; stroke-dasharray: 6 5; rx: 14; }
      .node-box { stroke-width: 1.5; rx: 10; }
      .node-title { font: 700 14px system-ui, -apple-system, sans-serif; }
      .node-desc { font: 400 11px system-ui, -apple-system, sans-serif; }
      .step-badge { font: 700 11px system-ui, -apple-system, sans-serif; }
      .arrow { stroke: #94a3b8; stroke-width: 2; fill: none; }
      .arrow-accent { stroke: #6366f1; stroke-width: 2; fill: none; }
      .pill { rx: 6; }
      .pill-text { font: 700 10px system-ui, -apple-system, sans-serif; }
      .warning-box { fill: #fff1f2; stroke: #fda4af; stroke-width: 1.2; rx: 8; }
      .warning-text { font: 600 11px system-ui, -apple-system, sans-serif; fill: #be123c; }
      .legend-text { font: 500 11px system-ui, -apple-system, sans-serif; fill: #475569; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1L8 5L0 9z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1L8 5L0 9z" fill="#6366f1"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1L8 5L0 9z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect class="bg" width="1080" height="420" rx="16"/>

  <!-- Header -->
  <text class="title" x="36" y="42">End-to-End Leakage-Safe KNN Modelling Workflow</text>
  <text class="subtitle" x="36" y="62">Complete lifecycle from raw data ingestion, encapsulated pipeline cross-validation, to final unbiased evaluation and serving</text>

  <!-- STEP 1: SPLIT DATA -->
  <g transform="translate(36, 85)">
    <rect class="card" width="160" height="150"/>
    <rect x="0" y="0" width="160" height="34" rx="12" fill="#f1f5f9"/>
    <rect x="0" y="22" width="160" height="12" fill="#f1f5f9"/>
    <text class="step-badge" x="12" y="22" fill="#475569">STAGE 1</text>
    <text class="node-title" x="12" y="58" fill="#0f172a">Data Split</text>
    <text class="node-desc" x="12" y="78" fill="#64748b">Verify row independence</text>
    <rect x="12" y="94" width="136" height="20" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text class="pill-text" x="18" y="108" fill="#1d4ed8">Train/Dev (80%)</text>
    <rect x="12" y="118" width="136" height="20" rx="4" fill="#fef2f2" stroke="#fecaca"/>
    <text class="pill-text" x="18" y="132" fill="#b91c1c">Untouched Test (20%)</text>
  </g>

  <!-- Arrow to CV Stage -->
  <path d="M 196 150 L 235 150" class="arrow" marker-end="url(#arrow)"/>

  <!-- STAGE 2: CROSS-VALIDATION ENCAPSULATION (CONTAINER) -->
  <g transform="translate(240, 85)">
    <rect class="card-cv" width="460" height="295"/>
    <rect x="14" y="-12" width="220" height="24" rx="6" fill="#e0e7ff" stroke="#a5b4fc"/>
    <text class="pill-text" x="22" y="4" fill="#4338ca">STAGE 2: CV &amp; PIPELINE TUNING</text>
    <text class="node-desc" x="18" y="28" fill="#64748b">Folds 1..K (Leakage-Safe Execution Inside GridSearchCV)</text>

    <!-- Fold Training Branch -->
    <g transform="translate(18, 42)">
      <rect width="185" height="110" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.2"/>
      <rect x="0" y="0" width="185" height="26" rx="8" fill="#e0e7ff"/>
      <rect x="0" y="18" width="185" height="8" fill="#e0e7ff"/>
      <text class="node-title" x="10" y="18" fill="#3730a3" font-size="12">Training Fold (K - 1)</text>
      <text class="node-desc" x="10" y="44" fill="#334155">• Fit Imputer &amp; Encoder</text>
      <text class="node-desc" x="10" y="62" fill="#334155">• Fit Scaler (Mean/Variance)</text>
      <text class="node-desc" x="10" y="80" fill="#334155">• Build KNN Index (KD/Ball)</text>
      <text class="node-desc" x="10" y="98" fill="#4f46e5" font-weight="600">fit_transform(X_tr)</text>
    </g>

    <!-- Arrow between Train & Val in CV -->
    <path d="M 203 97 L 235 97" class="arrow-indigo" marker-end="url(#arrow-indigo)"/>

    <!-- Fold Validation Branch -->
    <g transform="translate(240, 42)">
      <rect width="200" height="110" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.2"/>
      <rect x="0" y="0" width="200" height="26" rx="8" fill="#f1f5f9"/>
      <rect x="0" y="18" width="200" height="8" fill="#f1f5f9"/>
      <text class="node-title" x="10" y="18" fill="#0f172a" font-size="12">Validation Fold (1)</text>
      <text class="node-desc" x="10" y="44" fill="#334155">• Transform with Tr Stats</text>
      <text class="node-desc" x="10" y="62" fill="#334155">• Query Nearest Neighbours</text>
      <text class="node-desc" x="10" y="80" fill="#334155">• Compute Validation Metric</text>
      <text class="node-desc" x="10" y="98" fill="#059669" font-weight="600">transform(X_val) - No Fit!</text>
    </g>

    <!-- Joint Hyperparameter Search Box -->
    <g transform="translate(18, 168)">
      <rect width="422" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      <text class="node-title" x="12" y="24" fill="#0f172a">Joint Hyperparameter Grid Optimization</text>
      <text class="node-desc" x="12" y="44" fill="#475569">Simultaneously search interconnected axes across all CV folds:</text>

      <rect x="12" y="54" width="88" height="44" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text class="pill-text" x="18" y="70" fill="#6366f1">K Neighbors</text>
      <text class="node-desc" x="18" y="88" fill="#64748b">1, 3, 5, 9, 15</text>

      <rect x="108" y="54" width="94" height="44" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text class="pill-text" x="114" y="70" fill="#6366f1">Weights</text>
      <text class="node-desc" x="114" y="88" fill="#64748b">uniform, dist</text>

      <rect x="210" y="54" width="96" height="44" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text class="pill-text" x="216" y="70" fill="#6366f1">Metrics</text>
      <text class="node-desc" x="216" y="88" fill="#64748b">Euclid, Manh</text>

      <rect x="314" y="54" width="110" height="44" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text class="pill-text" x="320" y="70" fill="#6366f1">Preprocessing</text>
      <text class="node-desc" x="320" y="88" fill="#64748b">Std, Robust, PCA</text>
    </g>
  </g>

  <!-- Arrow from CV to Refit -->
  <path d="M 700 230 L 735 230" class="arrow" marker-end="url(#arrow)"/>

  <!-- STAGE 3: FULL REFIT -->
  <g transform="translate(740, 85)">
    <rect class="card" width="150" height="145"/>
    <rect x="0" y="0" width="150" height="34" rx="12" fill="#ecfdf5"/>
    <rect x="0" y="22" width="150" height="12" fill="#ecfdf5"/>
    <text class="step-badge" x="12" y="22" fill="#047857">STAGE 3</text>
    <text class="node-title" x="12" y="58" fill="#0f172a">Refit Pipeline</text>
    <text class="node-desc" x="12" y="78" fill="#64748b">Best params found</text>
    <text class="node-desc" x="12" y="96" fill="#334155">• Full Train/Dev set</text>
    <text class="node-desc" x="12" y="114" fill="#334155">• Lock parameters</text>
    <text class="node-desc" x="12" y="132" fill="#059669" font-weight="600">best_estimator_</text>
  </g>

  <!-- Arrow from Refit to Final Evaluation -->
  <path d="M 890 157 L 915 157" class="arrow" marker-end="url(#arrow)"/>

  <!-- STAGE 4: FINAL EVALUATION -->
  <g transform="translate(920, 85)">
    <rect class="card" width="130" height="145" stroke="#f43f5e" stroke-width="1.8"/>
    <rect x="0" y="0" width="130" height="34" rx="12" fill="#fff1f2"/>
    <rect x="0" y="22" width="130" height="12" fill="#fff1f2"/>
    <text class="step-badge" x="10" y="22" fill="#be123c">STAGE 4</text>
    <text class="node-title" x="10" y="56" fill="#0f172a">Test Once</text>
    <text class="node-desc" x="10" y="74" fill="#64748b">Untouched Test</text>
    <text class="node-desc" x="10" y="92" fill="#334155">• Accuracy / F1</text>
    <text class="node-desc" x="10" y="110" fill="#334155">• p99 Latency</text>
    <text class="warning-text" x="10" y="130" font-size="10">NO TUNING!</text>
  </g>

  <!-- Arrow from Test to Final Test set -->
  <path d="M 116 235 L 116 335 L 985 335 L 985 235" class="arrow" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <rect x="470" y="323" width="165" height="22" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text class="cond-txt" x="480" y="338" font-size="11" fill="#475569">Single Forward Evaluation Pass</text>

  <!-- STAGE 5: SERVING & MONITORING -->
  <g transform="translate(740, 248)">
    <rect class="card" width="310" height="132" fill="#f8fafc" stroke="#6366f1" stroke-width="1.5"/>
    <text class="node-title" x="14" y="26" fill="#4338ca">Stage 5: Deployment &amp; OOD Guardrail</text>
    <text class="node-desc" x="14" y="46" fill="#334155">• Serialize entire pipeline: <tspan font-family="monospace" fill="#0f172a">joblib.dump(gs.best_estimator_)</tspan></text>
    <text class="node-desc" x="14" y="66" fill="#334155">• Novelty score check: <tspan font-family="monospace" fill="#dc2626">r_k(x) &gt; tau_99%</tspan> alerts OOD</text>
    <text class="node-desc" x="14" y="86" fill="#334155">• Monitor latency SLAs &amp; distribution drift</text>
    <text class="node-desc" x="14" y="106" fill="#059669" font-weight="600">Production-Ready Inference Pipeline</text>
  </g>

  <path d="M 815 230 L 815 245" class="arrow-indigo" marker-end="url(#arrow-indigo)"/>

  <!-- Bottom Legend / Safety Rule -->
  <g transform="translate(36, 390)">
    <text class="legend-text" x="0" y="14"><tspan font-weight="700" fill="#0f172a">Cardinal Rule:</tspan> All data transformations (imputation, encoding, scaling) must be strictly learned from training folds and never from validation or test sets.</text>
  </g>
</svg>