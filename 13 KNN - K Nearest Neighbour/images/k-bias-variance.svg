<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Effect of k on the KNN decision boundary</title>
  <desc id="desc">Three panels show k equals one with a jagged boundary, a moderate k with a balanced smooth boundary, and a very large k with an oversmoothed boundary.</desc>
  <defs><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1}.a{fill:#2563eb}.b{fill:#f97316}.bound{fill:none;stroke:#7c3aed;stroke-width:4}.title{font:700 24px system-ui,sans-serif;fill:#111827}.head{font:700 18px system-ui,sans-serif;fill:#111827}.small{font:15px system-ui,sans-serif;fill:#475569}</style></defs>
  <rect class="bg" width="960" height="500" rx="18"/><text class="title" x="42" y="47">Choosing k controls locality and smoothness</text>
  <g transform="translate(40 80)"><rect class="panel" width="270" height="310" rx="12"/><text class="head" x="18" y="32">k = 1</text><text class="small" x="18" y="55">low bias · high variance</text><path class="bound" d="M16 180C45 115 75 250 103 150S156 245 185 135S230 225 254 125"/><circle class="a" cx="45" cy="110" r="8"/><circle class="a" cx="88" cy="135" r="8"/><circle class="a" cx="145" cy="95" r="8"/><circle class="a" cx="218" cy="105" r="8"/><circle class="b" cx="50" cy="245" r="8"/><circle class="b" cx="112" cy="230" r="8"/><circle class="b" cx="180" cy="250" r="8"/><circle class="b" cx="230" cy="220" r="8"/><circle class="b" cx="124" cy="117" r="8"/><text class="small" x="18" y="292">Fits noise and tiny islands</text></g>
  <g transform="translate(345 80)"><rect class="panel" width="270" height="310" rx="12"/><text class="head" x="18" y="32">moderate k</text><text class="small" x="18" y="55">balanced bias and variance</text><path class="bound" d="M15 183C75 140 125 180 165 155S225 150 255 125"/><circle class="a" cx="45" cy="110" r="8"/><circle class="a" cx="88" cy="135" r="8"/><circle class="a" cx="145" cy="95" r="8"/><circle class="a" cx="218" cy="105" r="8"/><circle class="b" cx="50" cy="245" r="8"/><circle class="b" cx="112" cy="230" r="8"/><circle class="b" cx="180" cy="250" r="8"/><circle class="b" cx="230" cy="220" r="8"/><circle class="b" cx="124" cy="117" r="8"/><text class="small" x="18" y="292">Smooths isolated noise</text></g>
  <g transform="translate(650 80)"><rect class="panel" width="270" height="310" rx="12"/><text class="head" x="18" y="32">very large k</text><text class="small" x="18" y="55">high bias · low variance</text><path class="bound" d="M14 173C105 163 175 157 256 143"/><circle class="a" cx="45" cy="110" r="8"/><circle class="a" cx="88" cy="135" r="8"/><circle class="a" cx="145" cy="95" r="8"/><circle class="a" cx="218" cy="105" r="8"/><circle class="b" cx="50" cy="245" r="8"/><circle class="b" cx="112" cy="230" r="8"/><circle class="b" cx="180" cy="250" r="8"/><circle class="b" cx="230" cy="220" r="8"/><circle class="b" cx="124" cy="117" r="8"/><text class="small" x="18" y="292">May erase real local structure</text></g>
  <text class="small" x="42" y="445">Select k with validation data; do not choose it from the final test set.</text>
</svg>
