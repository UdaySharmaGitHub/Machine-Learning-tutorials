<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Data Splitting Strategies for KNN</title>
  <desc id="desc">Visual comparison of Random Split, Stratified Split, Group-Aware Split, and Chronological Time-Series Split, highlighting data leakage risks in nearest neighbor models.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 22px system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 13px system-ui, -apple-system, sans-serif; fill: #64748b; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 12; }
      .card-title { font: 700 15px system-ui, -apple-system, sans-serif; fill: #1e293b; }
      .card-desc { font: 400 12px system-ui, -apple-system, sans-serif; fill: #64748b; }
      .fold-tr { fill: #dbeafe; stroke: #3b82f6; stroke-width: 1; rx: 4; }
      .fold-val { fill: #fee2e2; stroke: #ef4444; stroke-width: 1; rx: 4; }
      .fold-holdout { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1; rx: 4; }
      .fold-txt { font: 700 10px system-ui, -apple-system, sans-serif; }
      .badge { rx: 6; }
      .badge-txt { font: 700 10px system-ui, -apple-system, sans-serif; }
      .rule-box { fill: #f0fdf4; stroke: #86efac; stroke-width: 1.2; rx: 10; }
      .rule-title { font: 700 13px system-ui, -apple-system, sans-serif; fill: #166534; }
      .rule-desc { font: 500 12px system-ui, -apple-system, sans-serif; fill: #15803d; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="960" height="540" rx="16"/>

  <!-- Header -->
  <text class="title" x="36" y="42">KNN Validation: Choosing the Right Split Strategy</text>
  <text class="subtitle" x="36" y="62">KNN is hyper-sensitive to neighbor leakage across folds. Select the split that respects row dependency.</text>

  <!-- ==================== ROW 1, COL 1: RANDOM SPLIT ==================== -->
  <g transform="translate(36, 85)">
    <rect class="card" width="430" height="180"/>
    <text class="card-title" x="18" y="28">1. Standard Random K-Fold</text>
    <rect x="330" y="14" width="82" height="20" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text class="badge-txt" x="342" y="28" fill="#475569">KFold()</text>
    <text class="card-desc" x="18" y="48">Random assignment. Assumes strictly I.I.D. rows with balanced targets.</text>

    <!-- Visual Folds -->
    <g transform="translate(18, 64)">
      <!-- Fold 1 -->
      <rect class="fold-val" x="0" y="0" width="80" height="22"/>
      <text class="fold-txt" x="22" y="15" fill="#b91c1c">Val Fold</text>
      <rect class="fold-tr" x="86" y="0" width="80" height="22"/>
      <text class="fold-txt" x="106" y="15" fill="#1d4ed8">Train</text>
      <rect class="fold-tr" x="172" y="0" width="80" height="22"/>
      <text class="fold-txt" x="192" y="15" fill="#1d4ed8">Train</text>
      <rect class="fold-tr" x="258" y="0" width="80" height="22"/>
      <text class="fold-txt" x="278" y="15" fill="#1d4ed8">Train</text>

      <!-- Fold 2 -->
      <rect class="fold-tr" x="0" y="28" width="80" height="22"/>
      <text class="fold-txt" x="20" y="43" fill="#1d4ed8">Train</text>
      <rect class="fold-val" x="86" y="28" width="80" height="22"/>
      <text class="fold-txt" x="108" y="43" fill="#b91c1c">Val Fold</text>
      <rect class="fold-tr" x="172" y="28" width="80" height="22"/>
      <text class="fold-txt" x="192" y="43" fill="#1d4ed8">Train</text>
      <rect class="fold-tr" x="258" y="28" width="80" height="22"/>
      <text class="fold-txt" x="278" y="43" fill="#1d4ed8">Train</text>
    </g>

    <text class="card-desc" x="18" y="142" fill="#047857" font-weight="600">✓ Use only when:</text>
    <text class="card-desc" x="110" y="142">Rows are truly independent, uncorrelated samples.</text>
    <text class="card-desc" x="18" y="162" fill="#be123c" font-weight="600">✗ Failure risk:</text>
    <text class="card-desc" x="105" y="162">Class skew in folds; duplicate patient / device leakage.</text>
  </g>

  <!-- ==================== ROW 1, COL 2: STRATIFIED SPLIT ==================== -->
  <g transform="translate(494, 85)">
    <rect class="card" width="430" height="180"/>
    <text class="card-title" x="18" y="28">2. Stratified K-Fold</text>
    <rect x="290" y="14" width="122" height="20" rx="10" fill="#e0e7ff" stroke="#a5b4fc"/>
    <text class="badge-txt" x="302" y="28" fill="#4338ca">StratifiedKFold()</text>
    <text class="card-desc" x="18" y="48">Preserves exact percentage of each class in every train &amp; validation fold.</text>

    <!-- Visual Class distribution bars -->
    <g transform="translate(18, 64)">
      <!-- Fold 1 -->
      <rect x="0" y="0" width="310" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
      <rect x="2" y="2" width="230" height="18" rx="3" fill="#3b82f6"/>
      <text class="fold-txt" x="80" y="15" fill="#ffffff">Class A (80%)</text>
      <rect x="234" y="2" width="74" height="18" rx="3" fill="#f97316"/>
      <text class="fold-txt" x="244" y="15" fill="#ffffff">Class B (20%)</text>

      <!-- Fold 2 -->
      <rect x="0" y="28" width="310" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
      <rect x="2" y="30" width="230" height="18" rx="3" fill="#3b82f6"/>
      <text class="fold-txt" x="80" y="43" fill="#ffffff">Class A (80%)</text>
      <rect x="234" y="30" width="74" height="18" rx="3" fill="#f97316"/>
      <text class="fold-txt" x="244" y="43" fill="#ffffff">Class B (20%)</text>
      <text class="fold-txt" x="325" y="28" fill="#64748b">Identical Ratios</text>
    </g>

    <text class="card-desc" x="18" y="142" fill="#047857" font-weight="600">✓ Use always for:</text>
    <text class="card-desc" x="122" y="142">Imbalanced classification (e.g. 95% legit, 5% fraud).</text>
    <text class="card-desc" x="18" y="162" fill="#be123c" font-weight="600">✗ Failure risk:</text>
    <text class="card-desc" x="105" y="162">Does not prevent grouping or time-series leakage.</text>
  </g>

  <!-- ==================== ROW 2, COL 1: GROUP-AWARE SPLIT ==================== -->
  <g transform="translate(36, 285)">
    <rect class="card" width="430" height="185"/>
    <text class="card-title" x="18" y="28">3. Group-Aware Split</text>
    <rect x="300" y="14" width="112" height="20" rx="10" fill="#fef3c7" stroke="#fde68a"/>
    <text class="badge-txt" x="312" y="28" fill="#b45309">GroupKFold()</text>
    <text class="card-desc" x="18" y="48">Keeps all rows from the same entity/subject entirely in one fold.</text>

    <!-- Visual Group Entities -->
    <g transform="translate(18, 64)">
      <!-- Subject 1, 2, 3 in Train -->
      <rect x="0" y="0" width="105" height="26" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
      <text class="fold-txt" x="10" y="17" fill="#1e40af">Patient A [3 rows]</text>

      <rect x="112" y="0" width="105" height="26" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
      <text class="fold-txt" x="122" y="17" fill="#1e40af">Patient B [5 rows]</text>

      <rect x="224" y="0" width="105" height="26" rx="4" fill="#fee2e2" stroke="#ef4444"/>
      <text class="fold-txt" x="234" y="17" fill="#b91c1c">Patient C [4 rows]</text>

      <text class="fold-txt" x="80" y="44" fill="#1d4ed8">← Training Fold →</text>
      <text class="fold-txt" x="240" y="44" fill="#b91c1c">← Val Fold →</text>
    </g>

    <text class="card-desc" x="18" y="132" fill="#047857" font-weight="600">✓ Vital when:</text>
    <text class="card-desc" x="98" y="132">Multiple observations per person, device, or store.</text>
    <text class="card-desc" x="18" y="152" fill="#be123c" font-weight="700">CRITICAL LEAKAGE WARNING FOR KNN:</text>
    <text class="card-desc" x="18" y="170" fill="#991b1b">If Patient A's rows are split between train and val, KNN uses Patient A's own past record as its nearest neighbor!</text>
  </g>

  <!-- ==================== ROW 2, COL 2: TEMPORAL SPLIT ==================== -->
  <g transform="translate(494, 285)">
    <rect class="card" width="430" height="185"/>
    <text class="card-title" x="18" y="28">4. Chronological / Time-Series Split</text>
    <rect x="280" y="14" width="132" height="20" rx="10" fill="#e0f2fe" stroke="#bae6fd"/>
    <text class="badge-txt" x="292" y="28" fill="#0369a1">TimeSeriesSplit()</text>
    <text class="card-desc" x="18" y="48">Train strictly on past time intervals; evaluate only on future intervals.</text>

    <!-- Visual Walk-forward timeline -->
    <g transform="translate(18, 64)">
      <!-- Split 1 -->
      <rect class="fold-tr" x="0" y="0" width="120" height="18"/>
      <text class="fold-txt" x="30" y="13" fill="#1d4ed8">2021 (Train)</text>
      <rect class="fold-val" x="124" y="0" width="70" height="18"/>
      <text class="fold-txt" x="132" y="13" fill="#b91c1c">2022 (Val)</text>
      <rect class="fold-holdout" x="198" y="0" width="140" height="18"/>
      <text class="fold-txt" x="235" y="13" fill="#94a3b8">Unseen Future</text>

      <!-- Split 2 -->
      <rect class="fold-tr" x="0" y="24" width="194" height="18"/>
      <text class="fold-txt" x="55" y="37" fill="#1d4ed8">2021 + 2022 (Train)</text>
      <rect class="fold-val" x="198" y="24" width="70" height="18"/>
      <text class="fold-txt" x="206" y="37" fill="#b91c1c">2023 (Val)</text>
      <rect class="fold-holdout" x="272" y="24" width="66" height="18"/>
      <text class="fold-txt" x="280" y="37" fill="#94a3b8">Future</text>
    </g>

    <text class="card-desc" x="18" y="132" fill="#047857" font-weight="600">✓ Mandatory for:</text>
    <text class="card-desc" x="122" y="132">Stock prices, sensor logs, historical forecasting.</text>
    <text class="card-desc" x="18" y="152" fill="#be123c" font-weight="600">✗ Failure risk:</text>
    <text class="card-desc" x="105" y="152">Random split creates "lookahead bias" (peeking into future neighbors).</text>
  </g>

  <!-- Summary Banner -->
  <g transform="translate(36, 485)">
    <rect class="rule-box" width="888" height="38"/>
    <text class="rule-title" x="18" y="24">Golden Rule for KNN:</text>
    <text class="rule-desc" x="160" y="24">If identical entities or nearby timestamps cross between train and val, KNN will memorize them as nearest neighbors, yielding false ~99% validation accuracy!</text>
  </g>
</svg>