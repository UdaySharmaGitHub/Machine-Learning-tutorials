<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
<title id="title">Three outcomes of overshooting the minimum</title>
<desc id="desc">Three side-by-side iteration plots start with error x zero equal to ten. A multiplier of negative one half gives shrinking alternating errors that converge, negative one gives constant alternating errors, and negative one point five gives growing alternating errors that diverge. The vertical line at error zero marks the minimum.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1f2937}.grid{stroke:#dbe2ea;stroke-width:1}.axis{stroke:#475569;stroke-width:1.6}.tick{font-size:12px}.title{font-size:18px;font-weight:700}.formula{font-size:15px;fill:#475569}.status{font-size:14px;font-weight:600}</style>
<text x="720" y="29" text-anchor="middle" font-size="22" font-weight="700">Overshooting can converge, persist, or diverge</text>
<text x="720" y="52" text-anchor="middle" font-size="14" fill="#475569">Each plot shows signed error xₖ = θₖ − θ* over updates, starting from x₀ = 10</text>
<text class="title" x="240.0" y="78" text-anchor="middle">Convergent overshoot</text>
<text class="formula" x="240.0" y="98" text-anchor="middle">xₖ₊₁ = −0.5xₖ</text>
<line class="grid" x1="80" y1="390.0" x2="439" y2="390.0"/>
<text class="tick" x="72" y="394.0" text-anchor="end">-11</text>
<line class="grid" x1="80" y1="318.8" x2="439" y2="318.8"/>
<text class="tick" x="72" y="322.8" text-anchor="end">-5.5</text>
<line class="grid" x1="80" y1="247.5" x2="439" y2="247.5"/>
<text class="tick" x="72" y="251.5" text-anchor="end">0</text>
<line class="grid" x1="80" y1="176.2" x2="439" y2="176.2"/>
<text class="tick" x="72" y="180.2" text-anchor="end">5.5</text>
<line class="grid" x1="80" y1="105.0" x2="439" y2="105.0"/>
<text class="tick" x="72" y="109.0" text-anchor="end">11</text>
<line class="grid" x1="80.0" y1="105" x2="80.0" y2="390"/>
<text class="tick" x="80.0" y="408" text-anchor="middle">0</text>
<line class="grid" x1="139.8" y1="105" x2="139.8" y2="390"/>
<text class="tick" x="139.8" y="408" text-anchor="middle">1</text>
<line class="grid" x1="199.7" y1="105" x2="199.7" y2="390"/>
<text class="tick" x="199.7" y="408" text-anchor="middle">2</text>
<line class="grid" x1="259.5" y1="105" x2="259.5" y2="390"/>
<text class="tick" x="259.5" y="408" text-anchor="middle">3</text>
<line class="grid" x1="319.3" y1="105" x2="319.3" y2="390"/>
<text class="tick" x="319.3" y="408" text-anchor="middle">4</text>
<line class="grid" x1="379.2" y1="105" x2="379.2" y2="390"/>
<text class="tick" x="379.2" y="408" text-anchor="middle">5</text>
<line class="grid" x1="439.0" y1="105" x2="439.0" y2="390"/>
<text class="tick" x="439.0" y="408" text-anchor="middle">6</text>
<line class="axis" x1="80" y1="105" x2="80" y2="390"/>
<line class="axis" x1="80" y1="247.5" x2="439" y2="247.5" stroke="#111827" stroke-width="2.5"/>
<text class="tick" x="436" y="240.5" text-anchor="end">minimum xₖ = 0</text>
<text class="status" x="240.0" y="444" text-anchor="middle" fill="#2563eb">Shrinking oscillation → converges</text>
<text class="tick" x="240.0" y="463" text-anchor="middle">Update k</text>
<defs><clipPath id="clip0"><rect x="80" y="105" width="359" height="285"/></clipPath></defs>
<polyline points="80.00,117.95 139.83,312.27 199.67,215.11 259.50,263.69 319.33,239.40 379.17,251.55 439.00,245.48" fill="none" stroke="#2563eb" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" clip-path="url(#clip0)"/>
<circle cx="80.00" cy="117.95" r="4" fill="#fff" stroke="#2563eb" stroke-width="2"/>
<circle cx="139.83" cy="312.27" r="4" fill="#fff" stroke="#2563eb" stroke-width="2"/>
