<circle cx="919.00" cy="128.75" r="4" fill="#fff" stroke="#d97706" stroke-width="2"/>
<text class="title" x="1200.0" y="78" text-anchor="middle">Divergent overshoot</text>
<text class="formula" x="1200.0" y="98" text-anchor="middle">xₖ₊₁ = −1.5xₖ</text>
<line class="grid" x1="1040" y1="390.0" x2="1399" y2="390.0"/>
<text class="tick" x="1032" y="394.0" text-anchor="end">-40</text>
