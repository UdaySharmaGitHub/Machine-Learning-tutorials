<line class="axis" x1="560" y1="247.5" x2="919" y2="247.5" stroke="#111827" stroke-width="2.5"/>
<text class="tick" x="916" y="240.5" text-anchor="end">minimum xₖ = 0</text>
<text class="status" x="720.0" y="444" text-anchor="middle" fill="#d97706">Constant oscillation → no convergence</text>
<text class="tick" x="720.0" y="463" text-anchor="middle">Update k</text>
<defs><clipPath id="clip1"><rect x="560" y="105" width="359" height="285"/></clipPath></defs>
<polyline points="560.00,128.75 619.83,366.25 679.67,128.75 739.50,366.25 799.33,128.75 859.17,366.25 919.00,128.75" fill="none" stroke="#d97706" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" clip-path="url(#clip1)"/>
<circle cx="560.00" cy="128.75" r="4" fill="#fff" stroke="#d97706" stroke-width="2"/>
