<circle cx="439.00" cy="245.48" r="4" fill="#fff" stroke="#2563eb" stroke-width="2"/>
<text class="title" x="720.0" y="78" text-anchor="middle">Undamped oscillation</text>
<text class="formula" x="720.0" y="98" text-anchor="middle">xₖ₊₁ = −xₖ</text>
<line class="grid" x1="560" y1="390.0" x2="919" y2="390.0"/>
<text class="tick" x="552" y="394.0" text-anchor="end">-12</text>
