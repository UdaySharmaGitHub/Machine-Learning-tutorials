<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title desc">
<title id="title">Gradient descent learning-rate behavior on a quadratic</title>
<desc id="desc">Parameter theta over iterations for five learning rates, starting at four with a minimum at zero and curvature one. Moderate overshooting converges, alpha C equal to two oscillates, and alpha C above two diverges.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1f2937} .grid{stroke:#dbe2ea;stroke-width:1} .axis{stroke:#374151;stroke-width:2} .tick{font-size:14px} .label{font-size:17px;font-weight:600} .legend{font-size:15px}</style>
<text x="480.0" y="28" text-anchor="middle" font-size="22" font-weight="700">Learning-rate behavior on a quadratic cost</text>
<text x="480.0" y="49" text-anchor="middle" font-size="14" fill="#4b5563">C = 1 · θ₀ = 4 · θ* = 0 · update: θₜ₊₁ = θₜ − αC(θₜ − θ*)</text>
