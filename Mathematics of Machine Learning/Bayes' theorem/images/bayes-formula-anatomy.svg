<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title description">
  <title id="title">Anatomy of Bayes' theorem</title>
  <desc id="description">The equation posterior P(A given B) equals likelihood P(B given A) times prior P(A) divided by evidence P(B). Each term is colour-coded and labelled: posterior in blue, likelihood in orange, prior in green, and evidence in purple.</desc>

  <rect width="960" height="440" rx="16" fill="#ffffff"/>
  <text x="480" y="52" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">The four parts of Bayes' theorem</text>

  <!-- Equation -->
  <text x="150" y="215" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" text-anchor="middle" fill="#2563eb">P(A|B)</text>
  <text x="258" y="215" font-family="Georgia, 'Times New Roman', serif" font-size="46" text-anchor="middle" fill="#0f172a">=</text>

  <!-- Numerator -->
  <text x="430" y="188" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" text-anchor="middle" fill="#ea580c">P(B|A)</text>
  <text x="545" y="188" font-family="Georgia, 'Times New Roman', serif" font-size="40" text-anchor="middle" fill="#0f172a">·</text>
  <text x="625" y="188" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" text-anchor="middle" fill="#16a34a">P(A)</text>
  <!-- Fraction bar -->
  <line x1="330" y1="208" x2="720" y2="208" stroke="#334155" stroke-width="3"/>
  <!-- Denominator -->
  <text x="525" y="252" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" text-anchor="middle" fill="#7c3aed">P(B)</text>

  <!-- Callout: Posterior -->
  <line x1="150" y1="235" x2="150" y2="300" stroke="#2563eb" stroke-width="2"/>
  <rect x="40" y="300" width="220" height="92" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="326" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1e3a8a">Posterior</text>
  <text x="150" y="350" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" fill="#334155">Updated belief in A</text>
  <text x="150" y="368" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" fill="#334155">after observing evidence B</text>

  <!-- Callout: Likelihood -->
  <line x1="430" y1="150" x2="430" y2="110" stroke="#ea580c" stroke-width="2"/>
  <rect x="320" y="70" width="220" height="42" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="430" y="88" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#7c2d12">Likelihood</text>
  <text x="430" y="105" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#334155">How well A explains B</text>

  <!-- Callout: Prior -->
  <line x1="625" y1="150" x2="625" y2="110" stroke="#16a34a" stroke-width="2"/>
  <rect x="560" y="70" width="190" height="42" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="655" y="88" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#166534">Prior</text>
  <text x="655" y="105" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#334155">Belief in A before evidence</text>

  <!-- Callout: Evidence -->
  <line x1="525" y1="265" x2="525" y2="300" stroke="#7c3aed" stroke-width="2"/>
  <rect x="415" y="300" width="230" height="92" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="530" y="326" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#5b21b6">Evidence (marginal)</text>
  <text x="530" y="350" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" fill="#334155">Total probability of B;</text>
  <text x="530" y="368" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" fill="#334155">a normalising constant</text>

  <!-- Proportionality note -->
  <rect x="700" y="300" width="220" height="92" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="810" y="332" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#334155">Posterior &#8733;</text>
  <text x="810" y="356" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#334155">Likelihood &#215; Prior</text>
  <text x="810" y="378" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" fill="#64748b">(when B is fixed)</text>
</svg>
