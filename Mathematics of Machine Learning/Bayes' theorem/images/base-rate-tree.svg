<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title description">
  <title id="title">Why a 99% accurate test still gives mostly false positives</title>
  <desc id="description">A natural-frequency tree for a drug test with 0.3 percent prevalence, 99 percent sensitivity and 99 percent specificity, applied to 100,000 people. Of 300 real users, 297 test positive. Of 99,700 non-users, 997 still test positive. Among all 1,294 positive results only 297 are true users, so the chance a positive person is a user is about 23 percent.</desc>

  <rect width="1040" height="560" rx="16" fill="#ffffff"/>
  <text x="520" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#0f172a">Base rates matter: 100,000 people, test is 99% sensitive and 99% specific</text>
  <text x="520" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#64748b">Drug prevalence = 0.3%  &#8594;  300 real users, 99,700 non-users</text>

  <!-- Root -->
  <rect x="430" y="86" width="180" height="56" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="520" y="110" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">100,000 people</text>
  <text x="520" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#64748b">the whole population</text>

  <!-- Branches to Users / Non-users -->
  <line x1="470" y1="142" x2="260" y2="188" stroke="#334155" stroke-width="2"/>
  <line x1="570" y1="142" x2="780" y2="188" stroke="#334155" stroke-width="2"/>
  <text x="320" y="168" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#16a34a" font-weight="700">0.3% use</text>
  <text x="690" y="168" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748b" font-weight="700">99.7% don't</text>

  <!-- Users node -->
  <rect x="160" y="188" width="200" height="56" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="260" y="212" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#166534">300 users</text>
  <text x="260" y="232" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#334155">actually take the drug</text>

  <!-- Non-users node -->
  <rect x="680" y="188" width="200" height="56" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="780" y="212" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#334155">99,700 non-users</text>
  <text x="780" y="232" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#334155">do not take the drug</text>

  <!-- Users -> outcomes -->
  <line x1="220" y1="244" x2="140" y2="300" stroke="#16a34a" stroke-width="2"/>
  <line x1="300" y1="244" x2="340" y2="300" stroke="#16a34a" stroke-width="2"/>
  <text x="150" y="280" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#16a34a" font-weight="700">99% +</text>
  <text x="330" y="280" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#94a3b8" font-weight="700">1% &#8722;</text>

  <!-- Non-users -> outcomes -->
  <line x1="740" y1="244" x2="660" y2="300" stroke="#dc2626" stroke-width="2"/>
  <line x1="820" y1="244" x2="900" y2="300" stroke="#64748b" stroke-width="2"/>
  <text x="648" y="280" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#dc2626" font-weight="700">1% +</text>
  <text x="880" y="280" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b" font-weight="700">99% &#8722;</text>

  <!-- True positive -->
  <rect x="50" y="300" width="180" height="70" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="140" y="326" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#166534">297 test +</text>
  <text x="140" y="346" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#166534">TRUE positives</text>
  <text x="140" y="362" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#334155">users correctly caught</text>

  <!-- User false negative -->
  <rect x="260" y="300" width="150" height="70" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="335" y="326" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#64748b">3 test &#8722;</text>
  <text x="335" y="346" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#64748b">false negatives</text>

  <!-- False positive -->
  <rect x="570" y="300" width="180" height="70" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="660" y="326" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#991b1b">997 test +</text>
  <text x="660" y="346" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#991b1b">FALSE positives</text>
  <text x="660" y="362" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#334155">non-users wrongly flagged</text>

  <!-- Non-user true negative -->
  <rect x="780" y="300" width="190" height="70" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="875" y="326" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#64748b">98,703 test &#8722;</text>
  <text x="875" y="346" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#64748b">true negatives</text>

  <!-- Combine positives -->
  <line x1="140" y1="370" x2="420" y2="430" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="660" y1="370" x2="620" y2="430" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- Positives pool -->
  <rect x="300" y="430" width="440" height="56" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="520" y="454" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1e3a8a">All positive results = 297 + 997 = 1,294</text>
  <text x="520" y="474" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#334155">only 297 of these people actually use the drug</text>

  <!-- Result -->
  <rect x="300" y="502" width="440" height="42" rx="12" fill="#2563eb"/>
  <text x="520" y="529" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">P(user | positive) = 297 / 1,294 &#8776; 23%</text>
</svg>
