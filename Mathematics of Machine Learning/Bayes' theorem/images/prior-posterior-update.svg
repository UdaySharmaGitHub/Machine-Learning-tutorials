<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360" role="img" aria-labelledby="title description">
  <title id="title">Bayesian belief updating: from prior to posterior</title>
  <desc id="description">A left-to-right pipeline. A prior belief in a hypothesis enters, is combined with the likelihood of the observed evidence and normalised by the total evidence, and leaves as a posterior belief. Two small bars show the belief rising from a low prior to a higher posterior once evidence supports the hypothesis.</desc>

  <rect width="1040" height="360" rx="16" fill="#ffffff"/>
  <text x="520" y="46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">Bayesian updating: evidence turns a prior into a posterior</text>

  <!-- Prior box -->
  <rect x="40" y="110" width="200" height="150" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="140" y="140" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#166534">Prior</text>
  <text x="140" y="162" font-family="Georgia, 'Times New Roman', serif" font-size="18" text-anchor="middle" fill="#166534">P(A)</text>
  <text x="140" y="184" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#334155">belief before</text>
  <text x="140" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#334155">any evidence</text>
  <!-- small prior bar -->
  <rect x="90" y="222" width="100" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <rect x="90" y="222" width="22" height="18" rx="4" fill="#16a34a"/>
  <text x="140" y="256" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#64748b">low belief</text>

  <!-- Arrow 1 -->
  <line x1="248" y1="185" x2="330" y2="185" stroke="#334155" stroke-width="3"/>
  <polygon points="330,178 346,185 330,192" fill="#334155"/>

  <!-- Update engine -->
  <rect x="352" y="95" width="300" height="180" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="502" y="125" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#7c2d12">Combine with evidence</text>
  <text x="502" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="22" text-anchor="middle" fill="#0f172a">P(A) &#215; P(B|A)</text>
  <line x1="412" y1="186" x2="592" y2="186" stroke="#334155" stroke-width="2.5"/>
  <text x="502" y="214" font-family="Georgia, 'Times New Roman', serif" font-size="22" text-anchor="middle" fill="#0f172a">P(B)</text>
  <text x="502" y="250" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" fill="#7c2d12">multiply by likelihood, divide by total evidence</text>

  <!-- Arrow 2 -->
  <line x1="660" y1="185" x2="742" y2="185" stroke="#334155" stroke-width="3"/>
  <polygon points="742,178 758,185 742,192" fill="#334155"/>

  <!-- Posterior box -->
  <rect x="800" y="110" width="200" height="150" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="900" y="140" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1e3a8a">Posterior</text>
  <text x="900" y="162" font-family="Georgia, 'Times New Roman', serif" font-size="18" text-anchor="middle" fill="#1e3a8a">P(A|B)</text>
  <text x="900" y="184" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#334155">revised belief</text>
  <text x="900" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#334155">after evidence</text>
  <!-- small posterior bar -->
  <rect x="850" y="222" width="100" height="18" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <rect x="850" y="222" width="68" height="18" rx="4" fill="#2563eb"/>
  <text x="900" y="256" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#64748b">higher belief</text>

  <!-- Feedback loop caption -->
  <path d="M900,268 C900,320 140,320 140,268" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <polygon points="133,276 140,262 147,276" fill="#94a3b8"/>
  <text x="520" y="334" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#64748b">Today's posterior becomes tomorrow's prior &#8212; beliefs update as new evidence arrives</text>
</svg>
