<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="'Segoe UI', Arial, sans-serif">

  <!-- Background -->
  <rect width="760" height="360" fill="#f8f9fa" rx="12"/>

  <!-- Title -->
  <text x="380" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">Dependent Events — Each Draw Changes the Sample Space</text>

  <!-- ── BEFORE box ── -->
  <rect x="30" y="52" width="320" height="270" rx="10" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
  <text x="190" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90d9">Before Draw 1 — Full Deck (52 cards)</text>

  <!-- Card stack representation -->
  <rect x="80" y="95" width="60" height="84" rx="5" fill="#e8f0fe" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="110" y="130" text-anchor="middle" font-size="11" fill="#4a90d9" font-weight="bold">A♠</text>
  <text x="110" y="147" text-anchor="middle" font-size="10" fill="#555">4 Aces</text>
  <text x="110" y="162" text-anchor="middle" font-size="9" fill="#777">in deck</text>

  <rect x="165" y="95" width="60" height="84" rx="5" fill="#f5f5f5" stroke="#aaa" stroke-width="1.5"/>
  <text x="195" y="130" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">K♥</text>
  <rect x="250" y="95" width="60" height="84" rx="5" fill="#f5f5f5" stroke="#aaa" stroke-width="1.5"/>
  <text x="280" y="130" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">7♦</text>

  <!-- Stats before -->
  <rect x="60" y="196" width="230" height="58" rx="7" fill="#e8f0fe" stroke="#4a90d9" stroke-width="1.2"/>
  <text x="175" y="216" text-anchor="middle" font-size="12" fill="#333">Total cards: <tspan font-weight="bold" fill="#4a90d9">52</tspan></text>
  <text x="175" y="234" text-anchor="middle" font-size="12" fill="#333">Aces remaining: <tspan font-weight="bold" fill="#4a90d9">4</tspan></text>
  <text x="175" y="252" text-anchor="middle" font-size="13" fill="#333">P(Ace) = <tspan font-weight="bold" fill="#4a90d9">4/52 ≈ 0.077</tspan></text>

  <!-- Label -->
  <rect x="60" y="270" width="230" height="38" rx="6" fill="#4a90d9"/>
  <text x="175" y="285" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Draw 1: Ace is drawn</text>
  <text x="175" y="300" text-anchor="middle" font-size="10.5" fill="#dce9fb">→ Card is NOT put back</text>

  <!-- ── Arrow ── -->
  <line x1="358" y1="187" x2="400" y2="187" stroke="#e74c3c" stroke-width="2.5"/>
  <polygon points="396,181 408,187 396,193" fill="#e74c3c"/>
  <rect x="348" y="160" width="64" height="52" rx="6" fill="#fdecea" stroke="#e74c3c" stroke-width="1.2"/>
  <text x="380" y="178" text-anchor="middle" font-size="10" font-weight="bold" fill="#e74c3c">Sample</text>
  <text x="380" y="192" text-anchor="middle" font-size="10" font-weight="bold" fill="#e74c3c">Space</text>
  <text x="380" y="206" text-anchor="middle" font-size="10" font-weight="bold" fill="#e74c3c">Changes!</text>

  <!-- ── AFTER box ── -->
  <rect x="410" y="52" width="320" height="270" rx="10" fill="#ffffff" stroke="#e74c3c" stroke-width="2"/>
  <text x="570" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#e74c3c">After Draw 1 — Smaller Deck (51 cards)</text>

  <!-- Card stack after — showing ace removed -->
  <rect x="460" y="95" width="60" height="84" rx="5" fill="#fdecea" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="490" y="128" text-anchor="middle" font-size="10" fill="#e74c3c" font-weight="bold">A♠</text>
  <text x="490" y="144" text-anchor="middle" font-size="9" fill="#e74c3c">removed</text>
  <text x="490" y="158" text-anchor="middle" font-size="18" fill="#e74c3c">✕</text>

  <rect x="545" y="95" width="60" height="84" rx="5" fill="#f5f5f5" stroke="#aaa" stroke-width="1.5"/>
  <text x="575" y="130" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">K♥</text>
  <rect x="630" y="95" width="60" height="84" rx="5" fill="#f5f5f5" stroke="#aaa" stroke-width="1.5"/>
  <text x="660" y="130" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">7♦</text>

  <!-- Stats after -->
  <rect x="440" y="196" width="250" height="58" rx="7" fill="#fdecea" stroke="#e74c3c" stroke-width="1.2"/>
  <text x="565" y="216" text-anchor="middle" font-size="12" fill="#333">Total cards: <tspan font-weight="bold" fill="#e74c3c">51</tspan></text>
  <text x="565" y="234" text-anchor="middle" font-size="12" fill="#333">Aces remaining: <tspan font-weight="bold" fill="#e74c3c">3</tspan></text>
  <text x="565" y="252" text-anchor="middle" font-size="13" fill="#333">P(Ace) = <tspan font-weight="bold" fill="#e74c3c">3/51 ≈ 0.059</tspan></text>

  <!-- Final formula -->
  <rect x="440" y="270" width="250" height="38" rx="6" fill="#e74c3c"/>
  <text x="565" y="285" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">P(B|A) ≠ P(B)</text>
  <text x="565" y="300" text-anchor="middle" font-size="10.5" fill="#fdecea">0.059 ≠ 0.077 — Probabilities changed!</text>

  <!-- ── Bottom formula bar ── -->
  <rect x="30" y="332" width="700" height="22" rx="6" fill="#1a1a2e"/>
  <text x="380" y="347" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">
    P(A ∩ B) = P(A) × P(B|A) = 4/52 × 3/51 = 12/2652 = 1/221 ≈ 0.0045
  </text>

</svg>
