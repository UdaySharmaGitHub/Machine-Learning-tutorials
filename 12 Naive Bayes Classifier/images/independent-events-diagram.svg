<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="'Segoe UI', Arial, sans-serif">

  <!-- Background -->
  <rect width="760" height="340" fill="#f8f9fa" rx="12"/>

  <!-- Title -->
  <text x="380" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">Independent Events — Outcomes Do Not Affect Each Other</text>

  <!-- ── Left experiment: Coin flip ── -->
  <rect x="40" y="56" width="300" height="240" rx="10" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
  <text x="190" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90d9">Experiment A — Coin Flip</text>

  <!-- Coin -->
  <circle cx="190" cy="148" r="46" fill="#ffd700" stroke="#e6b800" stroke-width="2.5"/>
  <text x="190" y="144" text-anchor="middle" font-size="22" font-weight="bold" fill="#7a5c00">H</text>
  <text x="190" y="163" text-anchor="middle" font-size="11" fill="#7a5c00">Heads</text>

  <!-- P(A) label -->
  <rect x="120" y="210" width="140" height="38" rx="6" fill="#e8f0fe" stroke="#4a90d9" stroke-width="1.2"/>
  <text x="190" y="229" text-anchor="middle" font-size="13" fill="#1a1a2e">P(A) = P(Heads) =</text>
  <text x="190" y="247" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90d9">1/2 = 0.5</text>

  <!-- ── Right experiment: Die roll ── -->
  <rect x="420" y="56" width="300" height="240" rx="10" fill="#ffffff" stroke="#e07b39" stroke-width="2"/>
  <text x="570" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#e07b39">Experiment B — Die Roll</text>

  <!-- Die -->
  <rect x="530" y="102" width="80" height="80" rx="10" fill="#ffffff" stroke="#e07b39" stroke-width="2.5"/>
  <!-- Die face dots for "6" -->
  <circle cx="548" cy="120" r="5" fill="#e07b39"/>
  <circle cx="570" cy="120" r="5" fill="#e07b39"/>
  <circle cx="592" cy="120" r="5" fill="#e07b39"/>
  <circle cx="548" cy="142" r="5" fill="#e07b39"/>
  <circle cx="570" cy="142" r="5" fill="#e07b39"/>
  <circle cx="592" cy="142" r="5" fill="#e07b39"/>
  <text x="570" y="197" text-anchor="middle" font-size="12" fill="#555">shows 6</text>

  <!-- P(B) label -->
  <rect x="500" y="210" width="140" height="38" rx="6" fill="#fef0e8" stroke="#e07b39" stroke-width="1.2"/>
  <text x="570" y="229" text-anchor="middle" font-size="13" fill="#1a1a2e">P(B) = P(Die = 6) =</text>
  <text x="570" y="247" text-anchor="middle" font-size="14" font-weight="bold" fill="#e07b39">1/6 ≈ 0.167</text>

  <!-- ── Centre "no influence" arrow ── -->
  <line x1="346" y1="176" x2="418" y2="176" stroke="#aaa" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="414,170 424,176 414,182" fill="#aaa"/>
  <polygon points="350,170 340,176 350,182" fill="#aaa"/>
  <rect x="350" y="158" width="68" height="36" rx="6" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <text x="384" y="174" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555">No Effect</text>
  <text x="384" y="188" text-anchor="middle" font-size="10" fill="#777">P(B|A) = P(B)</text>

  <!-- ── Bottom formula bar ── -->
  <rect x="40" y="306" width="680" height="26" rx="6" fill="#1a1a2e"/>
  <text x="380" y="323" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">
    P(A ∩ B) = P(A) × P(B) = 1/2 × 1/6 = 1/12 ≈ 0.083
  </text>

</svg>
