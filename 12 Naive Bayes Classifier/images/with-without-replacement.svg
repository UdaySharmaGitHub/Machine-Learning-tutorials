<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="'Segoe UI', Arial, sans-serif">

  <!-- Background -->
  <rect width="760" height="430" fill="#f8f9fa" rx="12"/>

  <!-- Title -->
  <text x="380" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">With Replacement vs Without Replacement</text>

  <!-- Divider -->
  <line x1="380" y1="50" x2="380" y2="420" stroke="#ddd" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- ══════════════ LEFT — WITH REPLACEMENT ══════════════ -->
  <text x="190" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">✓ With Replacement → Independent</text>

  <!-- Bag 1 (initial state) -->
  <ellipse cx="190" cy="150" rx="68" ry="78" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="190" y="106" text-anchor="middle" font-size="11" fill="#27ae60" font-weight="bold">Bag</text>
  <!-- Balls inside bag 1 -->
  <circle cx="162" cy="133" r="14" fill="#e74c3c" stroke="#c0392b" stroke-width="1.5"/>
  <text x="162" y="138" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">R</text>
  <circle cx="190" cy="121" r="14" fill="#e74c3c" stroke="#c0392b" stroke-width="1.5"/>
  <text x="190" y="126" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">R</text>
  <circle cx="218" cy="133" r="14" fill="#e74c3c" stroke="#c0392b" stroke-width="1.5"/>
  <text x="218" y="138" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">R</text>
  <circle cx="168" cy="161" r="14" fill="#3498db" stroke="#2980b9" stroke-width="1.5"/>
  <text x="168" y="166" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">B</text>
  <circle cx="212" cy="161" r="14" fill="#3498db" stroke="#2980b9" stroke-width="1.5"/>
  <text x="212" y="166" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">B</text>
  <text x="190" y="212" text-anchor="middle" font-size="10" fill="#555">3 Red, 2 Blue (5 total)</text>

  <!-- Arrow down: draw 1 left -->
  <line x1="190" y1="234" x2="190" y2="258" stroke="#27ae60" stroke-width="2"/>
  <polygon points="184,254 190,266 196,254" fill="#27ae60"/>
  <text x="238" y="250" font-size="10" fill="#555">Draw 1: Red</text>

  <!-- Ball drawn out (left side) -->
  <circle cx="190" cy="284" r="16" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="190" y="289" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">R</text>

  <!-- "Put back" curved arrow going back up to bag -->
  <path d="M 214 284 Q 265 284 265 248 Q 265 216 228 213" stroke="#27ae60" stroke-width="1.8" fill="none" stroke-dasharray="5,3"/>
  <polygon points="224,208 232,217 236,208" fill="#27ae60"/>
  <text x="273" y="255" font-size="10" fill="#27ae60" font-weight="bold">Put back!</text>

  <!-- Dashed arrow: drawn ball → result state box -->
  <line x1="190" y1="306" x2="190" y2="328" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="4,3"/>

  <!-- Result state box (left) -->
  <rect x="78" y="332" width="224" height="46" rx="7" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
  <text x="190" y="351" text-anchor="middle" font-size="11" fill="#333">Bag unchanged after draw:</text>
  <text x="190" y="369" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Still 3 Red + 2 Blue (5 total)</text>

  <!-- Probability bar (left) -->
  <rect x="52" y="388" width="276" height="28" rx="5" fill="#27ae60"/>
  <text x="190" y="406" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">P(Draw 2 = R) = 3/5  (unchanged)</text>

  <!-- ══════════════ RIGHT — WITHOUT REPLACEMENT ══════════════ -->
  <text x="570" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#e74c3c">✗ Without Replacement → Dependent</text>

  <!-- Bag 1 right (initial state) -->
  <ellipse cx="570" cy="150" rx="68" ry="78" fill="#fdecea" stroke="#e74c3c" stroke-width="2"/>
  <text x="570" y="106" text-anchor="middle" font-size="11" fill="#e74c3c" font-weight="bold">Bag</text>
  <!-- Balls inside bag right -->
  <circle cx="542" cy="133" r="14" fill="#e74c3c" stroke="#c0392b" stroke-width="1.5"/>
  <text x="542" y="138" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">R</text>
  <circle cx="570" cy="121" r="14" fill="#e74c3c" stroke="#c0392b" stroke-width="1.5"/>
  <text x="570" y="126" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">R</text>
  <circle cx="598" cy="133" r="14" fill="#e74c3c" stroke="#c0392b" stroke-width="1.5"/>
  <text x="598" y="138" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">R</text>
  <circle cx="548" cy="161" r="14" fill="#3498db" stroke="#2980b9" stroke-width="1.5"/>
  <text x="548" y="166" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">B</text>
  <circle cx="592" cy="161" r="14" fill="#3498db" stroke="#2980b9" stroke-width="1.5"/>
  <text x="592" y="166" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">B</text>
  <text x="570" y="212" text-anchor="middle" font-size="10" fill="#555">3 Red, 2 Blue (5 total)</text>

  <!-- Arrow down: draw 1 right -->
  <line x1="570" y1="234" x2="570" y2="258" stroke="#e74c3c" stroke-width="2"/>
  <polygon points="564,254 570,266 576,254" fill="#e74c3c"/>
  <text x="618" y="250" font-size="10" fill="#555">Draw 1: Red</text>

  <!-- Ball drawn — kept out (right side) -->
  <circle cx="570" cy="284" r="16" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="570" y="289" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">R</text>
  <text x="624" y="288" font-size="10" fill="#e74c3c" font-weight="bold">Kept out!</text>

  <!-- Dashed arrow: drawn ball → result state box -->
  <line x1="570" y1="306" x2="570" y2="328" stroke="#e74c3c" stroke-width="1.4" stroke-dasharray="4,3"/>

  <!-- Result state box (right) -->
  <rect x="458" y="332" width="224" height="46" rx="7" fill="#fdecea" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="570" y="351" text-anchor="middle" font-size="11" fill="#333">Bag changed after draw:</text>
  <text x="570" y="369" text-anchor="middle" font-size="12" font-weight="bold" fill="#e74c3c">Now 2 Red + 2 Blue (4 total)</text>

  <!-- Probability bar (right) -->
  <rect x="430" y="388" width="280" height="28" rx="5" fill="#e74c3c"/>
  <text x="570" y="406" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">P(Draw 2 = R) = 2/4  (changed!)</text>

</svg>
