<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400">
  <!-- Background -->
  <rect width="860" height="400" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="430" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Laplace Smoothing — Before vs After  (α = 1, K = 2)</text>

  <!-- Vertical divider -->
  <line x1="430" y1="50" x2="430" y2="360" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- ═══════════════ LEFT: Without Smoothing ═══════════════ -->
  <text x="215" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">❌  Without Smoothing</text>

  <!-- Table header -->
  <rect x="22" y="76" width="400" height="26" rx="3" fill="#f1f5f9"/>
  <text x="100" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#475569">Feature</text>
  <text x="252" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#475569">Count in Spam  (N_spam = 3)</text>
  <text x="383" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#475569">P(word|Spam)</text>

  <!-- Row: Free -->
  <rect x="22" y="102" width="400" height="28" fill="white"/>
  <text x="100" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">Free</text>
  <text x="252" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">2</text>
  <text x="383" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#15803d">2/3 ≈ 0.667</text>

  <!-- Row: Win -->
  <rect x="22" y="130" width="400" height="28" fill="#f8fafc"/>
  <text x="100" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">Win</text>
  <text x="252" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">2</text>
  <text x="383" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#15803d">2/3 ≈ 0.667</text>

  <!-- Row: Offer (red) -->
  <rect x="22" y="158" width="400" height="28" fill="#fee2e2"/>
  <text x="100" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">Offer</text>
  <text x="252" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">0</text>
  <text x="383" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">0/3 = 0</text>

  <!-- Table border + column lines -->
  <rect x="22" y="76" width="400" height="110" rx="3" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="166" y1="76" x2="166" y2="186" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="316" y1="76" x2="316" y2="186" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Formula box -->
  <rect x="42" y="200" width="350" height="52" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="217" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#991b1b">P(Offer|Spam) = 0 / 3 = 0</text>
  <text x="217" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#991b1b">Score = 0.5 × 0.667 × 0.667 × 0 = 0</text>

  <!-- Arrow down -->
  <line x1="217" y1="254" x2="217" y2="280" stroke="#dc2626" stroke-width="2"/>
  <polygon points="211,277 217,291 223,277" fill="#dc2626"/>

  <!-- Result badge -->
  <rect x="77" y="291" width="280" height="60" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="217" y="311" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">P(Spam|X) = 0%</text>
  <text x="217" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#991b1b">P(Ham|X) = 100%</text>
  <text x="217" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#991b1b">Zero-frequency problem</text>

  <!-- ═══════════════ RIGHT: With Laplace Smoothing ═══════════════ -->
  <text x="645" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">✓  With Laplace Smoothing  (α = 1, K = 2)</text>

  <!-- Table header -->
  <rect x="448" y="76" width="400" height="26" rx="3" fill="#f1f5f9"/>
  <text x="524" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#475569">Feature</text>
  <text x="663" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#475569">Smoothed Count (+1)</text>
  <text x="806" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#475569">P(word|Spam)</text>

  <!-- Row: Free -->
  <rect x="448" y="102" width="400" height="28" fill="white"/>
  <text x="524" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">Free</text>
  <text x="663" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">2 + 1 = 3</text>
  <text x="806" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#15803d">3/5 = 0.600</text>

  <!-- Row: Win -->
  <rect x="448" y="130" width="400" height="28" fill="#f8fafc"/>
  <text x="524" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">Win</text>
  <text x="663" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">2 + 1 = 3</text>
  <text x="806" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#15803d">3/5 = 0.600</text>

  <!-- Row: Offer (green — fixed!) -->
  <rect x="448" y="158" width="400" height="28" fill="#f0fdf4"/>
  <text x="524" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534">Offer</text>
  <text x="663" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#16a34a">0 + 1 = 1</text>
  <text x="806" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#16a34a">1/5 = 0.200</text>

  <!-- Table border + column lines -->
  <rect x="448" y="76" width="400" height="110" rx="3" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="592" y1="76" x2="592" y2="186" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="742" y1="76" x2="742" y2="186" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Denominator note pill -->
  <rect x="468" y="190" width="360" height="20" rx="10" fill="#fefce8" stroke="#fde047" stroke-width="1"/>
  <text x="648" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#713f12">Denominator: N_spam + α·K = 3 + 1×2 = 5  (K = 2: binary Yes/No feature)</text>

  <!-- Formula box -->
  <rect x="468" y="215" width="360" height="52" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="648" y="237" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#166534">P(Offer|Spam) = (0+1)/(3+2) = 1/5 = 0.200</text>
  <text x="648" y="257" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#166534">Score(Spam) = 0.5 × 0.6 × 0.6 × 0.2 = 0.036  ≠  0</text>

  <!-- Arrow down -->
  <line x1="648" y1="269" x2="648" y2="280" stroke="#16a34a" stroke-width="2"/>
  <polygon points="642,277 648,291 654,277" fill="#16a34a"/>

  <!-- Result badge -->
  <rect x="508" y="291" width="280" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="648" y="311" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">P(Spam|X) = 36%</text>
  <text x="648" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#166534">P(Ham|X) = 64%</text>
  <text x="648" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#166534">Zero probability fixed — both classes considered</text>

  <!-- Bottom caption -->
  <text x="430" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">Laplace smoothing fixes the zero-probability collapse. Prediction can stay the same — what matters is both classes get a fair hearing.</text>
</svg>
