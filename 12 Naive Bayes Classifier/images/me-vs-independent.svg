<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="'Segoe UI', Arial, sans-serif">

  <defs>
    <clipPath id="clip-indep-b">
      <circle cx="623" cy="162" r="78"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="760" height="330" fill="#f8f9fa" rx="12"/>

  <!-- Panel divider -->
  <line x1="380" y1="10" x2="380" y2="320" stroke="#ddd" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- ══════════════ LEFT PANEL — MUTUALLY EXCLUSIVE ══════════════ -->
  <text x="190" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">✗ Mutually Exclusive Events</text>

  <!-- Sample space box left -->
  <rect x="20" y="40" width="340" height="190" rx="8" fill="none" stroke="#ccc" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="348" y="53" text-anchor="end" font-size="9" fill="#bbb">S</text>

  <!-- Circle A left -->
  <circle cx="120" cy="140" r="75" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.2"/>
  <text x="120" y="134" text-anchor="middle" font-size="20" font-weight="bold" fill="#1d4ed8">A</text>
  <text x="120" y="154" text-anchor="middle" font-size="10" fill="#1e40af">Heads</text>

  <!-- Circle B left -->
  <circle cx="295" cy="140" r="75" fill="#fee2e2" stroke="#ef4444" stroke-width="2.2"/>
  <text x="295" y="134" text-anchor="middle" font-size="20" font-weight="bold" fill="#dc2626">B</text>
  <text x="295" y="154" text-anchor="middle" font-size="10" fill="#b91c1c">Tails</text>

  <!-- Gap indicator -->
  <text x="207" y="130" text-anchor="middle" font-size="16" fill="#ccc">∅</text>
  <text x="207" y="148" text-anchor="middle" font-size="9" fill="#bbb">no overlap</text>

  <!-- Left formula box -->
  <rect x="60" y="248" width="260" height="24" rx="6" fill="#fff" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="190" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">P(A ∩ B) = 0   →   P(B | A) = 0</text>

  <!-- Left annotation -->
  <text x="190" y="304" text-anchor="middle" font-size="11" fill="#555">Knowing A occurred → B is impossible</text>

  <!-- ══════════════ RIGHT PANEL — INDEPENDENT ══════════════ -->
  <text x="570" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">✓ Independent Events</text>

  <!-- Sample space box right -->
  <rect x="400" y="40" width="340" height="190" rx="8" fill="none" stroke="#ccc" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="728" y="53" text-anchor="end" font-size="9" fill="#bbb">S</text>

  <!-- Circle A right -->
  <circle cx="497" cy="162" r="78" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.2" fill-opacity="0.65"/>

  <!-- Circle B right -->
  <circle cx="623" cy="162" r="78" fill="#fee2e2" stroke="#ef4444" stroke-width="2.2" fill-opacity="0.65"/>

  <!-- Intersection region (clipped) — purple highlight -->
  <circle cx="497" cy="162" r="78" clip-path="url(#clip-indep-b)" fill="#a855f7" fill-opacity="0.45" stroke="none"/>

  <!-- Labels inside circles -->
  <text x="468" y="156" text-anchor="middle" font-size="20" font-weight="bold" fill="#1d4ed8">A</text>
  <text x="468" y="176" text-anchor="middle" font-size="10" fill="#1e40af">Coin flip</text>
  <text x="652" y="156" text-anchor="middle" font-size="20" font-weight="bold" fill="#dc2626">B</text>
  <text x="652" y="176" text-anchor="middle" font-size="10" fill="#b91c1c">Die roll</text>

  <!-- Intersection label -->
  <text x="560" y="158" text-anchor="middle" font-size="9" fill="#6b21a8" font-weight="bold">A∩B</text>
  <text x="560" y="171" text-anchor="middle" font-size="8" fill="#7c3aed">both</text>

  <!-- Right formula box -->
  <rect x="410" y="248" width="300" height="24" rx="6" fill="#fff" stroke="#86efac" stroke-width="1.2"/>
  <text x="560" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#16a34a">P(A ∩ B) = P(A)·P(B)   →   P(B | A) = P(B)</text>

  <!-- Right annotation -->
  <text x="560" y="304" text-anchor="middle" font-size="11" fill="#555">Knowing A occurred → P(B) unchanged</text>

</svg>
